name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-check:
    name: spec-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 文档↔代码一致性闸门
        run: python tools/spec_check.py

  mvn-test:
    name: mvn-test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          # 仅 CI 临时库，不是生产密码；job 结束容器即销毁。
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: band_test
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 初始化 band_test
        env:
          MYSQL_PWD: root
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
          mysql -h127.0.0.1 -uroot -e "SET GLOBAL log_bin_trust_function_creators = 1; SET GLOBAL time_zone = '+08:00';" || true
          mysql --default-character-set=utf8mb4 -h127.0.0.1 -uroot band_test < sql/schema.sql

      - name: mvn test
        env:
          TZ: Asia/Shanghai
          SPRING_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3306/band_test?characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn -B test

      - name: 验证发布包（不重复跑测试）
        run: mvn -B -P release -DskipTests package

      - name: 失败时上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
