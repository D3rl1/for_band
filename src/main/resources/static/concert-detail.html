<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>演出详情 · 乐团管理系统</title>
<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/app.js"></script>
</head>
<body>
<div id="navbar"></div>

<div class="cell mb-4">
  <div class="d-flex justify-content-between align-items-start">
    <div>
      <h2 id="c-name" class="mb-1"></h2>
      <p id="c-meta" class="chip mb-2"></p>
      <p id="c-note" class="mb-0"></p>
    </div>
    <div class="d-flex gap-2">
      <button id="print" class="go go-ghost go-sm" type="button">打印节目单</button>
      <button id="edit" class="go go-ghost go-sm" type="button" hidden>编辑档案</button>
    </div>
  </div>
</div>

<!-- 编辑档案（曲目单 / 参演名单各自有弹层） -->
<div class="cell mb-4" id="edit-box" hidden>
  <div class="lab">编辑演出档案</div>
  <div class="row g-2">
    <div class="col-12 col-md-4"><input id="f-name" class="w-100" maxlength="64" placeholder="演出名*"></div>
    <div class="col-6 col-md-2"><input id="f-date" type="date" class="w-100"></div>
    <div class="col-6 col-md-2"><input id="f-start" type="time" class="w-100"></div>
    <div class="col-6 col-md-2"><input id="f-venue" class="w-100" maxlength="64" placeholder="地点"></div>
    <div class="col-6 col-md-2"><input id="f-host" class="w-100" maxlength="64" placeholder="主办"></div>
    <div class="col-12 col-md-4"><input id="f-video" class="w-100" maxlength="255" placeholder="录像链接"></div>
    <div class="col-6 col-md-2">
      <select id="f-status" class="w-100">
        <option value="PLANNED">计划中</option>
        <option value="DONE">已完成</option>
        <option value="CANCELED">已取消</option>
      </select>
    </div>
    <div class="col-12"><textarea id="f-summary" rows="3" class="w-100" placeholder="演出总结 / 复盘（改动会留痕）"></textarea></div>
    <div class="col-12 d-flex gap-2">
      <button id="save" class="go go-sm" type="button">保存</button>
      <button id="cancel" class="go go-ghost go-sm" type="button">取消</button>
    </div>
  </div>
</div>

<div class="cell mb-4">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="lab mb-0">曲目单</span>
    <button id="edit-program" class="go go-ghost go-sm" type="button" hidden>设置曲目单</button>
  </div>
  <table class="tb">
    <thead><tr><th>#</th><th>曲目</th><th>作曲</th><th>指挥</th></tr></thead>
    <tbody id="program"></tbody>
  </table>
  <p id="program-empty" class="chip mb-0" hidden>还没排曲目单</p>
</div>

<div class="cell mb-4">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="lab mb-0">参演名单</span>
    <button id="edit-cast" class="go go-ghost go-sm" type="button" hidden>设置名单</button>
  </div>
  <p id="cast" class="mb-0"></p>
  <p id="cast-empty" class="chip mb-0" hidden>还没定参演名单</p>
</div>

<div class="cell mb-4">
  <div class="lab">照片</div>
  <p class="chip">演出当天拍的照片都能传上来（传之前会自动压到长边 1920）。删除只有上传者本人或管理员能做。</p>
  <div id="photos" class="d-flex flex-wrap gap-2"></div>
  <p id="photos-empty" class="chip mb-0" hidden>还没有照片</p>
  <div class="row g-2 mt-2">
    <div class="col-12 col-md-6"><input id="p-file" type="file" accept="image/*" multiple class="w-100"></div>
    <div class="col-12 col-md-3"><input id="p-caption" class="w-100" maxlength="128" placeholder="说明（可空）"></div>
    <div class="col-12 col-md-3"><button id="p-send" class="go go-sm" type="button">上传照片</button></div>
  </div>
</div>

<!-- 曲目单编辑：勾选顺序即演出顺序，每首可单独写指挥 -->
<div class="modal fade" id="program-modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-body">
        <p class="big my-2">设置曲目单</p>
        <p class="chip">勾选顺序就是演出顺序；「指挥」写在这一首上（协奏曲请外聘指挥也能表达）。曲目从曲目库选。</p>
        <div id="pm-list" class="pm-list"></div>
        <p id="pm-empty" class="chip mb-0" hidden>曲目库还是空的，先去「曲目」页建一条</p>
      </div>
      <div class="modal-footer py-1">
        <button class="go go-ghost go-sm" data-bs-dismiss="modal">取消</button>
        <button class="go go-sm" id="pm-save">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 参演名单：**能选到已毕业 / 休团 / 荣誉团员**（"毕业了回团参演"很常见） -->
<div class="modal fade" id="cast-modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-body">
        <p class="big my-2">设置参演名单</p>
        <p class="chip">已毕业、休团、荣誉团员都能列入（他们不计考勤、也不能自己报名，但"回团参演"是允许的）。</p>
        <input id="cm-search" class="w-100 mb-2" placeholder="搜姓名">
        <div id="cm-list" class="pm-list"></div>
      </div>
      <div class="modal-footer py-1">
        <button class="go go-ghost go-sm" data-bs-dismiss="modal">取消</button>
        <button class="go go-sm" id="cm-save">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

const id = new URLSearchParams(location.search).get('id');
let me = null;
let canEdit = false;
let detail = null;
let members = [];

async function load() {
  me = await BAND.renderNav('concerts.html');
  if (!me) return;
  canEdit = ['ADMIN', 'LEADER', 'CONDUCTOR'].includes(me.role);
  document.getElementById('edit').hidden = !canEdit;
  document.getElementById('edit-program').hidden = !canEdit;
  document.getElementById('edit-cast').hidden = !canEdit;

  detail = await BAND.must(`/api/concerts/${id}`);
  const c = detail.concert;
  document.querySelector('.head h1').textContent = c.name;
  document.getElementById('c-name').textContent = c.name;
  document.getElementById('c-meta').textContent = [
    c.date, c.startTime ? c.startTime.slice(0, 5) : null, c.venue,
    c.host ? '主办：' + c.host : null, c.statusLabel,
  ].filter(Boolean).join(' · ');
  document.getElementById('c-note').textContent = c.note || '';
  if (detail.videoUrl) {
    const p = document.getElementById('c-note');
    const a = document.createElement('a');
    a.href = detail.videoUrl;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '　录像链接 ↗';
    p.appendChild(a);
  }
  document.getElementById('f-name').value = c.name;
  document.getElementById('f-date').value = c.date;
  document.getElementById('f-start').value = c.startTime ? c.startTime.slice(0, 5) : '';
  document.getElementById('f-venue').value = c.venue || '';
  document.getElementById('f-host').value = c.host || '';
  document.getElementById('f-video').value = detail.videoUrl || '';
  document.getElementById('f-status').value = c.status;
  document.getElementById('f-summary').value = detail.summary || '';

  // 曲目单（序号 · 曲名 · 作曲 · 指挥）
  const ptbody = document.getElementById('program');
  ptbody.innerHTML = '';
  document.getElementById('program-empty').hidden = detail.program.length > 0;
  for (const p of detail.program) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td><td></td><td></td>';
    tr.children[0].textContent = p.orderNo;
    const a = document.createElement('a');
    a.href = `/piece-detail.html?id=${p.pieceId}`;
    a.textContent = p.title || '（曲目已删除）';
    tr.children[1].appendChild(a);
    tr.children[2].textContent = p.composer || '';
    tr.children[3].textContent = p.conductor || '';
    ptbody.appendChild(tr);
  }

  // 参演名单
  document.getElementById('cast-empty').hidden = detail.cast.length > 0;
  document.getElementById('cast').textContent = detail.cast
    .map((m) => `${m.name}（${m.roleLabel}）${m.note ? ' · ' + m.note : ''}`).join('、');

  // 照片
  const host = document.getElementById('photos');
  host.innerHTML = '';
  document.getElementById('photos-empty').hidden = detail.photos.length > 0;
  for (const photo of detail.photos) {
    const cell = document.createElement('div');
    cell.className = 'ph-cell';
    const img = document.createElement('img');
    img.alt = photo.caption || '';
    BAND.fileBlobUrl(photo.fileId).then((url) => { img.src = url; }).catch(() => {});
    cell.appendChild(img);
    if (photo.caption) {
      const cap = document.createElement('span');
      cap.className = 'ph-cap';
      cap.textContent = photo.caption;
      cell.appendChild(cap);
    }
    const mine = photo.uploadedByName && me.name === photo.uploadedByName;
    if (mine || me.role === 'ADMIN') {
      const del = document.createElement('button');
      del.className = 'ph-del';
      del.type = 'button';
      del.textContent = '删除';
      del.addEventListener('click', async () => {
        if (!await BAND.confirm({ title: '删掉这张照片？', body: photo.caption || '（无说明）' })) return;
        await BAND.must(`/api/concerts/${id}/photos/${photo.id}`, { method: 'DELETE' });
        BAND.toast('已删除', 'success');
        load();
      });
      cell.appendChild(del);
    }
    host.appendChild(cell);
  }
}

document.getElementById('print').addEventListener('click', () => {
  window.open(`/api/concerts/${id}/program.html`, '_blank');
});
document.getElementById('edit').addEventListener('click', () => {
  document.getElementById('edit-box').hidden = !document.getElementById('edit-box').hidden;
});
document.getElementById('cancel').addEventListener('click', () => {
  document.getElementById('edit-box').hidden = true;
});
document.getElementById('save').addEventListener('click', async () => {
  const body = {
    name: document.getElementById('f-name').value.trim(),
    date: document.getElementById('f-date').value || null,
    startTime: document.getElementById('f-start').value || null,
    venue: document.getElementById('f-venue').value.trim() || null,
    host: document.getElementById('f-host').value.trim() || null,
    videoUrl: document.getElementById('f-video').value.trim() || null,
    status: document.getElementById('f-status').value,
    summary: document.getElementById('f-summary').value.trim() || null,
  };
  if (!body.name || !body.date) {
    BAND.toast('演出名与日期都要填');
    return;
  }
  await BAND.must(`/api/concerts/${id}`, { method: 'PUT', body });
  document.getElementById('edit-box').hidden = true;
  BAND.toast('已保存（复盘改动会留痕）', 'success');
  load();
});

// ---- 曲目单编辑 ----
document.getElementById('edit-program').addEventListener('click', async () => {
  const all = await BAND.must('/api/pieces?size=100');
  const current = detail.program.map((p) => p.pieceId);
  const ordered = current.map((pid) => all.list.find((p) => p.id === pid)).filter(Boolean)
    .concat(all.list.filter((p) => !current.includes(p.id)));
  document.getElementById('pm-empty').hidden = ordered.length > 0;
  const host = document.getElementById('pm-list');
  host.innerHTML = '';
  for (const p of ordered) {
    const row = document.createElement('div');
    row.className = 'd-flex align-items-center gap-2 py-1';
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.value = p.id;
    box.checked = current.includes(p.id);
    const name = document.createElement('span');
    name.className = 'flex-grow-1';
    name.textContent = `${p.title}${p.composer ? ' · ' + p.composer : ''}（${p.statusLabel}）`;
    const cond = document.createElement('input');
    cond.className = 'w-auto';
    cond.placeholder = '指挥';
    const existing = detail.program.find((x) => x.pieceId === p.id);
    cond.value = existing && existing.conductor ? existing.conductor : '';
    row.append(box, name, cond);
    host.appendChild(row);
  }
  bootstrap.Modal.getOrCreateInstance(document.getElementById('program-modal')).show();
});
document.getElementById('pm-save').addEventListener('click', async () => {
  const items = [...document.querySelectorAll('#pm-list > div')]
    .filter((row) => row.querySelector('input[type=checkbox]').checked)
    .map((row) => ({
      pieceId: Number(row.querySelector('input[type=checkbox]').value),
      conductor: row.querySelector('input[placeholder=指挥]').value.trim() || null,
    }));
  await BAND.must(`/api/concerts/${id}/program`, { method: 'PUT', body: { items } });
  bootstrap.Modal.getInstance(document.getElementById('program-modal')).hide();
  BAND.toast('曲目单已保存', 'success');
  load();
});

// ---- 参演名单编辑（含非 ACTIVE 的人）----
document.getElementById('edit-cast').addEventListener('click', async () => {
  if (!members.length) {
    const d = await BAND.must('/api/members?size=200');
    members = d.list;
  }
  const chosen = new Map(detail.cast.map((m) => [m.memberId, m.note || '']));
  const host = document.getElementById('cm-list');
  const draw = (keyword) => {
    host.innerHTML = '';
    const kw = (keyword || '').trim();
    for (const m of members.filter((m) => !kw || m.name.includes(kw))) {
      const row = document.createElement('div');
      row.className = 'd-flex align-items-center gap-2 py-1';
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.value = m.id;
      box.checked = chosen.has(m.id);
      const label = document.createElement('span');
      label.className = 'flex-grow-1';
      // 状态也显示出来：已毕业 / 休团的人照样能上台
      label.textContent = `${m.name} · ${m.sectionName || '无声部'} · ${BAND.statusLabel(m.status)}`;
      row.append(box, label);
      host.appendChild(row);
    }
  };
  draw('');
  document.getElementById('cm-search').value = '';
  document.getElementById('cm-search').oninput = (e) => {
    // 保留已勾选状态：先把当前勾选记下来
    [...host.querySelectorAll('input[type=checkbox]')].forEach((b) => {
      if (b.checked) chosen.set(Number(b.value), chosen.get(Number(b.value)) || '');
      else chosen.delete(Number(b.value));
    });
    draw(e.target.value);
    [...host.querySelectorAll('input[type=checkbox]')].forEach((b) => {
      b.checked = chosen.has(Number(b.value));
    });
  };
  bootstrap.Modal.getOrCreateInstance(document.getElementById('cast-modal')).show();
});
document.getElementById('cm-save').addEventListener('click', async () => {
  const picked = [...document.querySelectorAll('#cm-list input[type=checkbox]')]
    .filter((b) => b.checked)
    .map((b) => ({ memberId: Number(b.value) }));
  await BAND.must(`/api/concerts/${id}/cast`, { method: 'PUT', body: { members: picked } });
  bootstrap.Modal.getInstance(document.getElementById('cast-modal')).hide();
  BAND.toast('名单已保存', 'success');
  load();
});

// ---- 照片上传（先压缩）----
document.getElementById('p-send').addEventListener('click', async () => {
  const input = document.getElementById('p-file');
  if (!input.files.length) {
    BAND.toast('先选照片');
    return;
  }
  const caption = document.getElementById('p-caption').value.trim() || null;
  for (const file of input.files) {
    const compressed = await BAND.compressImage(file);
    const uploaded = await BAND.uploadFile(compressed);
    await BAND.must(`/api/concerts/${id}/photos`, {
      method: 'POST',
      body: { fileId: uploaded.id, caption },
    });
  }
  input.value = '';
  BAND.toast('已上传', 'success');
  load();
});

load();
</script>
</body>
</html>
