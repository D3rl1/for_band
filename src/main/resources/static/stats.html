<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>考勤统计 · 乐团管理系统</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#13211D">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="山水乐团">

<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/band-alive.js"></script>
<script src="/band-core.js"></script>
<script src="/band-media.js"></script>
<script src="/band-notify.js"></script>
<script src="/band-profile.js"></script>
<script src="/band-shell.js"></script>
<script src="/band-welcome.js"></script>
</head>
<body>
<div id="navbar"></div>

<!-- ⭐ 主视图（`docs/05` §5.4 / `DECISIONS` D25）：
     **主体 = 「最近一次」+「可展开的历次场次」**；出勤率在下面（字号降一档）。
     2026-10-18 精装：版式照样张，接口 / 权限 / 口径一个字没动。 -->
<div class="row2" id="latest"></div>

<div class="stats-toggle">
  <button id="all-toggle" class="go go-ghost go-sm" type="button" aria-expanded="false">
    <span class="toggle-t">查看全部过往</span>
    <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6"/></svg>
  </button>
</div>
<div class="stats-all" id="all-box" hidden>
  <table class="tb" id="sessions-table">
    <thead><tr><th scope="col">日期</th><th scope="col">活动</th><th scope="col">统计</th></tr></thead>
    <tbody id="sessions-rows"></tbody>
  </table>
</div>

<div class="row2 mt-4" id="cards"></div>
<p class="chip stats-foot">出勤率 = 出勤人次 ÷ 应到人次（含请假与缺勤）。请假日次单独列出。</p>

<script>
const PENTA = ['宫', '商', '角', '徵', '羽'];
const MINE = { PRESENT: '出勤', PARTIAL: '遗憾离场', LEAVE: '请假', ABSENT: '缺勤' };

/** 我在这场是什么状态（`mine` 由服务端判：有行就是行里的，没行但该到 = 缺勤）。 */
function mineLabel(mine) {
  return MINE[mine] || '—';
}

/** 本人状态胶囊。认不出的值给中性底——**别把"未知"翻译成"缺勤"再标红**。 */
function mineChip(mine, small) {
  // PARTIAL（遗憾离场）必须中性：朱砂只留给真正的缺勤
  const tone = mine === 'PRESENT' ? ' is-ok' : mine === 'LEAVE' ? ' is-leave' : mine === 'ABSENT' ? ' is-abs' : '';
  const el = document.createElement('span');
  el.className = 'mine-chip' + (small ? ' sm' : '') + tone;
  el.textContent = '我：' + mineLabel(mine);
  return el;
}

/** 「最近一次排练 / 最近一次声部课」：**具体是哪一场** + 那一场的数（不再是光秃秃一个百分比）。 */
function latestCard(label, s, canSeeAll) {
  const el = document.createElement('div');
  el.className = 'cell stats-latest';
  el.innerHTML = '<div class="lab"></div>'
    + '<p class="lt-title"><b class="lt-name"></b></p>'
    + '<p class="lt-when"></p>'
    + '<p class="lt-nums"></p>';
  el.querySelector('.lab').textContent = label;

  if (!s) {
    el.classList.add('is-empty');
    el.querySelector('.lt-name').textContent = '还没有记录';
    return el;
  }

  el.querySelector('.lt-name').textContent = s.title || '（未命名）';
  el.querySelector('.lt-when').textContent = s.date + ' · ' + BAND.kindLabel(s.kind);

  const nums = el.querySelector('.lt-nums');
  if (canSeeAll) {
    // 四数等宽；每个数各自一个 `[data-count]` 元素（「界面的活性」①），标签留在外面
    const pairs = [['应到', s.expected], ['出勤', s.present], ['请假', s.leave], ['缺勤', s.absent]];
    nums.innerHTML = pairs.map(([lab, v]) =>
      `<span class="num"><b class="n${lab === '缺勤' ? ' abs' : ''}" data-count>${v}</b><small>${lab}</small></span>`
    ).join('');
  } else {
    nums.appendChild(mineChip(s.mine, false));
  }
  return el;
}

/** 历次场次里的一行。⚠️ 活动名做成**进那一场的链接**（规格：每行一场、可点进单场明细）。 */
function sessionRow(s, canSeeAll) {
  const tr = document.createElement('tr');
  tr.innerHTML = '<td class="s-date"></td><td class="s-act"></td><td class="s-stat"></td>';

  tr.children[0].textContent = s.date || '';

  const a = document.createElement('a');
  a.className = 'act-link';
  a.href = '/event-detail.html?id=' + s.eventId;
  a.textContent = s.title || '（未命名）';
  tr.children[1].appendChild(a);
  const kind = document.createElement('span');
  kind.className = 'kind';
  kind.textContent = BAND.kindLabel(s.kind);
  tr.children[1].appendChild(kind);

  const stat = tr.children[2];
  if (canSeeAll) {
    // ⚠️ 逐行统计**不数**（docs/14：列表与分页文字不进滚动队列）
    stat.innerHTML = `应到 <span class="n">${s.expected}</span> · 出勤 <span class="n">${s.present}</span>`
      + ` · 请假 <span class="n">${s.leave}</span> · 缺勤 <span class="n abs">${s.absent}</span>`;
  } else {
    stat.appendChild(mineChip(s.mine, true));
  }
  return tr;
}

/** 出勤率那两张卡（**降级为辅助**：位置挪到下面、字号降一档 `.dim`；口径一个字没改）。 */
function kindCard(label, k) {
  const lit = k.expected === 0 ? 0 : Math.round((k.rate || 0) * 5);
  // 分母为 0（指挥 / 荣誉团员）：出勤率那一格显示「—」，出勤横条**为空**⇒ 压根不画（docs/14 §14.6.4 ④）
  const noData = k.expected === 0;
  const el = document.createElement('div');
  el.className = 'cell stats-rate';
  el.innerHTML = `
    <div class="lab"></div>
    <p class="big dim" data-count></p>
    ${noData ? '' : `<div class="attbar" style="--r:${k.rate || 0}"><b></b></div>`}
    <div class="penta"></div>
    <p class="chip mb-0"></p>`;
  el.querySelector('.lab').textContent = label;
  el.querySelector('.big').textContent = BAND.ratePct(k.rate, k.expected);
  el.querySelector('.penta').innerHTML = PENTA.map((n, i) =>
    `<div class="pv ${i < lit ? 'on' : ''}"><i></i><em>${n}</em></div>`).join('');
  // 出勤率与请假数成对出现（docs/05 硬规则）。⚠️ 这四个数**各自一个 span**——「界面的活性」① 要求
  // "要数的数字必须各自在独立元素里"，`·` 留在外面当文本节点。
  el.querySelector('.chip').innerHTML =
    `应到 <span class="n" data-count>${k.expected}</span> · 出勤 <span class="n" data-count>${k.present}</span>`
    + ` · 请假 <span class="n" data-count>${k.leave}</span> · 缺勤 <span class="n abs" data-count>${k.absent}</span>`;
  return el;
}

async function load() {
  const me = await BAND.renderNav('stats.html');
  if (!me) return;
  // 荣誉团员与普通团员一样只看本人（docs/02 §2.3：他人考勤不可见）；服务端也按同一角色裁剪
  const canSeeAll = me.role !== 'MEMBER' && me.role !== 'HONORARY';

  const latest = document.getElementById('latest');
  latest.innerHTML = '';
  const tbody = document.getElementById('sessions-rows');
  tbody.innerHTML = '';

  // ⚠️ **只拉这一次**：「最近一次」两块与「全部过往」那张表**共用同一份数据**，别再各拉一遍。
  const d = await BAND.must('/api/attendance/sessions?size=50');
  const rows = d.list || [];
  const firstOf = (kind) => rows.find((r) => r.kind === kind) || null;
  latest.append(
    latestCard('最近一次排练', firstOf('REHEARSAL'), canSeeAll),
    latestCard('最近一次声部课', firstOf('SECTION_CLASS'), canSeeAll));
  for (const s of rows) tbody.appendChild(sessionRow(s, canSeeAll));
  // ⚠️ 列表**默认收着**（HTML 里那个 `hidden` 就是初始态，**别再动它**）；
  //    一场都没有时连那个入口都不给（整块父级隐藏，不是只把按钮禁用）。
  document.getElementById('all-toggle').parentElement.hidden = rows.length === 0;

  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  if (canSeeAll) {
    const stats = await BAND.must('/api/attendance/stats');
    stats.kinds
      .map((k) => kindCard(k.kind === 'SECTION_CLASS' ? '声部课' : '排练', k))
      .forEach((el) => cards.appendChild(el));
  } else {
    const s = await BAND.must(`/api/members/${me.id}/attendance-summary`);
    cards.append(kindCard('排练出勤', s.rehearsal), kindCard('声部课出勤', s.sectionClass));
  }
  // ⚠️ 必须在卡片都建好**之后**才播（早调会快照到空点阵；而"播过"的标志一置位就再也不播了）。
  //    `latest` 也在这时才加入：两块最近卡的数字同样要滚。
  BAND.alive(latest, cards, document.getElementById('sessions-table'));
}

document.getElementById('all-toggle').addEventListener('click', () => {
  const box = document.getElementById('all-box');
  const btn = document.getElementById('all-toggle');
  box.hidden = !box.hidden;
  btn.setAttribute('aria-expanded', String(!box.hidden));
  btn.querySelector('.toggle-t').textContent = box.hidden ? '查看全部过往' : '收起';
});

load();
</script>
</body>
</html>
