<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乐团管理系统</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f5f5; margin: 0; }
  .wrap { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  .status { padding: 12px 16px; border-radius: 8px; background: #e2e3e5; margin-bottom: 24px; }
  .status.up { background: #d1e7dd; }
  .status.down { background: #f8d7da; }
  li { padding: 8px 0; border-bottom: 1px solid #ddd; list-style: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>乐团管理系统</h1>
  <p class="status" id="health">加载中…</p>
  <h2 style="font-size:16px;">声部</h2>
  <ul id="sections" style="padding:0;"></ul>
</div>
<script>
async function load() {
  const healthEl = document.getElementById('health');
  const listEl = document.getElementById('sections');
  try {
    const health = await (await fetch('/api/health')).json();
    if (health.code === 0) {
      healthEl.textContent = '服务正常 · 数据库已连接 · 声部 ' + health.data.sectionCount + ' 个';
      healthEl.classList.add('up');
    } else {
      healthEl.textContent = '异常：' + health.message;
      healthEl.classList.add('down');
    }
    const res = await (await fetch('/api/sections')).json();
    for (const s of res.data) {
      const li = document.createElement('li');
      li.textContent = s.name;
      listEl.appendChild(li);
    }
  } catch (e) {
    healthEl.textContent = '无法连接后端服务';
    healthEl.classList.add('down');
  }
}
load();
</script>
</body>
</html>
