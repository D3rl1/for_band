<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团员管理 · 乐团管理系统</title>
<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/app.js"></script>
</head>
<body>
<div id="navbar"></div>

<div class="cell mb-4">
  <div class="lab">新建账号</div>
  <form id="create-form" class="row g-2">
    <div class="col-6 col-md-2"><input id="c-name" class="w-100" placeholder="姓名*" required></div>
    <div class="col-6 col-md-2"><input id="c-account" class="w-100" placeholder="账号*" required></div>
    <div class="col-6 col-md-2"><select id="c-section" class="w-100"></select></div>
    <div class="col-6 col-md-2">
      <select id="c-role" class="w-100">
        <option value="MEMBER">团员</option>
        <option value="SECTION_LEADER">声部长</option>
        <option value="CONDUCTOR">指挥</option>
        <option value="LEADER">团长</option>
      </select>
    </div>
    <div class="col-6 col-md-2"><input id="c-instrument" class="w-100" placeholder="乐器"></div>
    <div class="col-6 col-md-2"><input id="c-phone" class="w-100" placeholder="手机号"></div>
    <!-- 入团日期（docs/03 §3.4 上线迁移）：默认当天，可改成更早。它门控考勤，别乱填 -->
    <div class="col-6 col-md-2">
      <label class="chip mb-0" for="c-joined">入团日期</label>
      <input type="date" id="c-joined" class="w-100">
    </div>
    <div class="col-12"><button class="go go-sm" type="submit">创建并生成初始密码</button></div>
  </form>
</div>

<div class="d-flex justify-content-between align-items-center mb-2">
  <h2 class="mb-0">成员列表</h2>
  <button id="export-btn" class="go go-ghost go-sm">导出账号表 CSV</button>
</div>
<table class="tb" id="admin-members-table">
  <thead><tr><th>姓名</th><th>声部</th><th>角色</th><th>状态</th><th>账号</th><th>激活</th><th>入团日期</th><th class="act"></th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<div class="modal fade" id="pw-modal">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-body text-center">
        <p id="pw-text" class="big my-2"></p>
        <p class="chip">初始密码只显示这一次，请立即发给本人</p>
      </div>
      <div class="modal-footer py-1"><button class="go go-sm" data-bs-dismiss="modal">我已保存</button></div>
    </div>
  </div>
</div>

<div class="modal fade" id="hon-modal">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-body">
        <p id="hon-title" class="big my-2"></p>
        <p class="chip">登录有效期，必填（默认毕业后 2 年，可改；过期后无法登录）</p>
        <input type="date" id="hon-until" class="w-100" required>
      </div>
      <div class="modal-footer py-1">
        <button class="go go-ghost go-sm" data-bs-dismiss="modal">取消</button>
        <button class="go go-sm" id="hon-save">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="edit-modal">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-body">
        <p id="edit-title" class="big my-2"></p>
        <label class="chip mb-1" for="edit-role">角色</label>
        <select id="edit-role" class="w-100 mb-2"></select>
        <label class="chip mb-1" for="edit-section">声部</label>
        <select id="edit-section" class="w-100 mb-2"></select>
        <label class="chip mb-1" for="edit-status">状态</label>
        <select id="edit-status" class="w-100"></select>
        <p class="chip mt-2">改状态为非「在团」会立即吊销他的登录态。</p>
      </div>
      <div class="modal-footer py-1">
        <button class="go go-ghost go-sm" data-bs-dismiss="modal">取消</button>
        <button class="go go-sm" id="edit-save">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
let sections = [];
async function load() {
  const me = await BAND.renderNav('admin-members.html');
  if (!me) return;
  sections = await BAND.must('/api/sections');
  document.getElementById('c-section').innerHTML =
    '<option value="">无声部</option>' + sections.map((s) => `<option value="${s.id}">${s.name}</option>`).join('');
  document.getElementById('c-joined').value = todayLocal();
  await loadRows();
}

/** 本地时区的今天（不能用 toISOString——它是 UTC，早上 8 点前会差一天）。 */
function todayLocal() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

async function loadRows() {
  const d = await BAND.must('/api/members?size=100');
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  for (const m of d.list) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td><td></td><td><span class="chip"></span></td><td></td><td></td><td></td><td class="act"></td>';
    tr.children[0].textContent = m.name;
    tr.children[1].textContent = m.sectionName || '';
    tr.children[2].textContent =
      BAND.roleLabel(m.role) + (m.role === 'HONORARY' && m.honoraryUntil ? ` · 至 ${m.honoraryUntil}` : '');
    const chip = tr.querySelector('.chip');
    chip.textContent = BAND.statusLabel(m.status);
    if (m.status !== 'ACTIVE') chip.classList.add('warn');
    tr.children[4].textContent = m.account || '';
    tr.children[5].textContent = m.activated ? '已激活' : '未激活';
    // 入团日期：就地可改（docs/03 §3.4「必须能改」）。改它会动出勤率分母，所以先确认
    const joinedInput = document.createElement('input');
    joinedInput.type = 'date';
    joinedInput.value = m.joinedAt || '';
    joinedInput.addEventListener('change', async () => {
      const next = joinedInput.value || null;
      if (next === (m.joinedAt || null)) return;
      if (!confirm(`把 ${m.name} 的入团日期改为 ${next || '（清空）'}？\n`
          + '它会动出勤率分母——应到名单按入团日期算。')) {
        joinedInput.value = m.joinedAt || '';
        return;
      }
      await BAND.must(`/api/admin/members/${m.id}`, { method: 'PUT', body: { joinedAt: next } });
      BAND.toast('已更新入团日期', 'success');
      loadRows();
    });
    tr.children[6].appendChild(joinedInput);
    const action = tr.children[7];
    // 编辑（docs/03 §3.4 + docs/14 §14.5.1，#79）：角色 / 声部 / 状态。换届、毕业/退团都走它
    const editBtn = document.createElement('button');
    editBtn.className = 'go go-ghost go-sm me-1';
    editBtn.textContent = '编辑';
    editBtn.addEventListener('click', () => openEditModal(m));
    const resetBtn = document.createElement('button');
    resetBtn.className = 'go go-ghost go-sm me-1';
    resetBtn.textContent = '重置密码';
    resetBtn.addEventListener('click', async () => {
      if (!confirm(`确定重置 ${m.name} 的密码？原密码与登录态立即失效。`)) return;
      const pw = await BAND.must(`/api/admin/members/${m.id}/reset-password`, { method: 'POST' });
      showPassword(pw);
    });
    const kickBtn = document.createElement('button');
    kickBtn.className = 'go go-ghost go-sm me-1';
    kickBtn.textContent = '踢下线';
    kickBtn.addEventListener('click', async () => {
      if (!confirm(`确定把 ${m.name} 踢下线？其全部登录态立即失效，但账号状态不变、可重新登录。`)) return;
      await BAND.must(`/api/admin/members/${m.id}/revoke-sessions`, { method: 'POST' });
      BAND.toast('已踢下线', 'success');
    });
    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'go go-ghost go-sm';
    toggleBtn.textContent = m.status === 'ACTIVE' ? '停用' : '恢复在团';
    toggleBtn.addEventListener('click', async () => {
      const status = m.status === 'ACTIVE' ? 'PAUSED' : 'ACTIVE';
      if (!confirm(`${m.name} → ${BAND.statusLabel(status)}？${status !== 'ACTIVE' ? '其登录态将被吊销。' : ''}`)) return;
      await BAND.must(`/api/admin/members/${m.id}`, { method: 'PUT', body: { status } });
      BAND.toast('已更新', 'success');
      loadRows();
    });
    action.append(editBtn, resetBtn, kickBtn, toggleBtn);
    // 荣誉团员（docs/03 §3.4）：仅已毕业可授予；有效期必填，默认毕业后 2 年；续期走同一入口
    if (m.status === 'GRADUATED' && m.role !== 'HONORARY') {
      const grantBtn = document.createElement('button');
      grantBtn.className = 'go go-ghost go-sm';
      grantBtn.textContent = '授予荣誉团员';
      grantBtn.addEventListener('click', () => openHonModal(m, plusTwoYears(m.leftAt)));
      action.append(grantBtn);
    } else if (m.role === 'HONORARY') {
      const renewBtn = document.createElement('button');
      renewBtn.className = 'go go-ghost go-sm';
      renewBtn.textContent = '续期';
      renewBtn.addEventListener('click', () => openHonModal(m, m.honoraryUntil || plusTwoYears(m.leftAt)));
      action.append(renewBtn);
    }
    tbody.appendChild(tr);
  }
  BAND.alive(document.getElementById('admin-members-table'));   // 「列表逐行入场」（docs/14 §14.6.4 ③）
}

function showPassword(pw) {
  document.getElementById('pw-text').textContent = pw;
  new bootstrap.Modal(document.getElementById('pw-modal')).show();
}

let honTarget = null;
function openHonModal(m, until) {
  honTarget = m.id;
  document.getElementById('hon-title').textContent = `${m.name} · ${m.role === 'HONORARY' ? '续期' : '授予荣誉团员'}`;
  document.getElementById('hon-until').value = until || '';
  bootstrap.Modal.getOrCreateInstance(document.getElementById('hon-modal')).show();
}

function plusTwoYears(dateStr) {
  const d = dateStr ? new Date(dateStr) : new Date();
  d.setFullYear(d.getFullYear() + 2);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

document.getElementById('hon-save').addEventListener('click', async () => {
  const until = document.getElementById('hon-until').value;
  if (!until) {
    BAND.toast('必须填写登录有效期');
    return;
  }
  await BAND.must(`/api/admin/members/${honTarget}`, {
    method: 'PUT',
    body: { role: 'HONORARY', honoraryUntil: until },
  });
  bootstrap.Modal.getInstance(document.getElementById('hon-modal')).hide();
  BAND.toast('已保存', 'success');
  loadRows();
});

// ---------- 编辑弹窗（docs/03 §3.4「管理端『编辑团员』弹窗」，#79）----------
const EDIT_ROLE_OPTIONS = [
  ['MEMBER', '团员'], ['SECTION_LEADER', '声部长'], ['CONDUCTOR', '指挥'], ['LEADER', '团长'],
];
const EDIT_STATUS_OPTIONS = ['ACTIVE', 'PAUSED', 'LEFT', 'GRADUATED'];

let editMember = null;

function openEditModal(m) {
  editMember = m;
  document.getElementById('edit-title').textContent = m.name;
  // 当前是荣誉团员时角色栏只给两项（docs/03 §3.4 边界③）：它必须配 honorary_until，授予/续期走既有入口
  const roleOptions = m.role === 'HONORARY'
    ? [['HONORARY', '荣誉团员（当前）'], ['MEMBER', '团员（撤销荣誉）']]
    : EDIT_ROLE_OPTIONS;
  const roleSel = document.getElementById('edit-role');
  roleSel.innerHTML = roleOptions.map(([v, t]) => `<option value="${v}">${t}</option>`).join('');
  roleSel.value = m.role;
  const secSel = document.getElementById('edit-section');
  secSel.innerHTML = '<option value="">无声部</option>'
    + sections.map((s) => `<option value="${s.id}">${s.name}</option>`).join('');
  secSel.value = m.sectionId == null ? '' : String(m.sectionId);
  const stSel = document.getElementById('edit-status');
  stSel.innerHTML = EDIT_STATUS_OPTIONS
    .map((v) => `<option value="${v}">${BAND.statusLabel(v)}</option>`).join('');
  stSel.value = m.status;
  bootstrap.Modal.getOrCreateInstance(document.getElementById('edit-modal')).show();
}

document.getElementById('edit-save').addEventListener('click', async () => {
  const m = editMember;
  const body = {};   // 部分更新：只提交改动过的字段（docs/03 §3.4）
  const role = document.getElementById('edit-role').value;
  if (role !== m.role) body.role = role;
  const rawSection = document.getElementById('edit-section').value;
  const sectionId = rawSection ? Number(rawSection) : null;
  if (sectionId !== (m.sectionId == null ? null : m.sectionId)) {
    // 清空声部必须带显式标记——只发 sectionId:null 会被后端当"未提供"（docs/03 §3.4 边界②）
    if (sectionId === null) body.clearSection = true;
    else body.sectionId = sectionId;
  }
  const status = document.getElementById('edit-status').value;
  if (status !== m.status) {
    if (status !== 'ACTIVE'
        && !confirm(`${m.name} → ${BAND.statusLabel(status)}？\n他会被立即踢下线、不能再登录。`)) return;
    body.status = status;
  }
  if (!Object.keys(body).length) {
    bootstrap.Modal.getInstance(document.getElementById('edit-modal')).hide();
    return;
  }
  try {
    await BAND.must(`/api/admin/members/${m.id}`, { method: 'PUT', body });
  } catch (e) {
    return;   // 失败不关浮层：BAND.must 已 toast 后端消息原文，改完可直接再点保存（docs/14 §14.5.1）
  }
  bootstrap.Modal.getInstance(document.getElementById('edit-modal')).hide();
  BAND.toast('已保存', 'success');
  loadRows();   // 后端可能有连带改动：清 honorary_until、写 left_at、吊销 token
});

// 导出走 fetch 而不是 <a href>：裸链接不带 Authorization 头，永远是 401
document.getElementById('export-btn').addEventListener('click', async () => {
  const res = await fetch('/api/admin/accounts/export', {
    headers: { Authorization: 'Bearer ' + BAND.token() },
  });
  if (!res.ok) {
    BAND.toast('导出失败（HTTP ' + res.status + '）');
    return;
  }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'accounts.csv';
  a.click();
  URL.revokeObjectURL(url);
  BAND.toast('已导出', 'success');
});

document.getElementById('create-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    name: document.getElementById('c-name').value.trim(),
    account: document.getElementById('c-account').value.trim(),
    sectionId: document.getElementById('c-section').value ? Number(document.getElementById('c-section').value) : null,
    role: document.getElementById('c-role').value,
    instrument: document.getElementById('c-instrument').value.trim() || null,
    phone: document.getElementById('c-phone').value.trim() || null,
    joinedAt: document.getElementById('c-joined').value || null,
  };
  const created = await BAND.must('/api/admin/members', { method: 'POST', body });
  showPassword(created.initialPassword);
  e.target.reset();
  document.getElementById('c-joined').value = todayLocal();   // reset 会清空日期，补回默认当天
  loadRows();
});

load();
</script>
</body>
</html>
