<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活动管理 · 乐团管理系统</title>
<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/app.js"></script>
</head>
<body>
<div id="navbar"></div>

<div class="cell mb-4">
  <div class="lab">单场活动</div>
  <form id="single-form" class="row g-2">
    <div class="col-4 col-md-2">
      <select id="k-kind" class="w-100">
        <option value="REHEARSAL">排练</option>
        <option value="SECTION_CLASS">声部课</option>
        <option value="DRESS_REHEARSAL">彩排</option>
      </select>
    </div>
    <div class="col-8 col-md-3"><input id="k-title" class="w-100" placeholder="标题*" required></div>
    <div class="col-6 col-md-2"><input id="k-date" type="date" class="w-100" required></div>
    <div class="col-3 col-md-2"><input id="k-start" type="time" class="w-100" required></div>
    <div class="col-3 col-md-2"><input id="k-end" type="time" class="w-100" required></div>
    <div class="col-6 col-md-2"><select id="k-section" class="w-100" disabled></select></div>
    <div class="col-6 col-md-3"><input id="k-location" class="w-100" placeholder="地点"></div>
    <div class="col-6 col-md-2"><button class="go go-sm" type="submit">创建</button></div>
  </form>
</div>

<div class="cell mb-4">
  <div class="lab">批量生成（按星期几，节假日之后逐场取消）</div>
  <form id="batch-form" class="row g-2 align-items-center">
    <div class="col-4 col-md-2">
      <select id="b-kind" class="w-100">
        <option value="REHEARSAL">排练</option>
        <option value="SECTION_CLASS">声部课</option>
      </select>
    </div>
    <div class="col-8 col-md-3"><input id="b-title" class="w-100" placeholder="标题*" required></div>
    <div class="col-4 col-md-2"><input id="b-from" type="date" class="w-100" required></div>
    <div class="col-4 col-md-2"><input id="b-to" type="date" class="w-100" required></div>
    <div class="col-12 col-md-3 d-flex gap-2 flex-wrap" id="b-weekdays"></div>
    <div class="col-3 col-md-2"><input id="b-start" type="time" class="w-100" required></div>
    <div class="col-3 col-md-2"><input id="b-end" type="time" class="w-100" required></div>
    <div class="col-4 col-md-2"><input id="b-location" class="w-100" placeholder="地点"></div>
    <div class="col-4 col-md-2"><select id="b-section" class="w-100" disabled></select></div>
    <div class="col-4 col-md-2"><button class="go go-sm" type="submit">批量生成</button></div>
  </form>
</div>

<h2 class="mb-3">活动列表</h2>
<table class="tb" id="admin-events-table">
  <thead><tr><th>日期</th><th>类型</th><th>标题</th><th>时间</th><th>声部</th><th>状态</th><th class="act"></th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<!-- 曲目单弹层：勾选顺序即练习顺序（整体替换，见 PUT /api/events/{id}/pieces） -->
<div class="modal fade" id="pieces-modal">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-body">
        <p id="pm-title" class="big my-2"></p>
        <p class="chip">勾选这场要练的曲目，勾选顺序就是练习顺序。曲目从曲目库里选（曲目页可以先新建）。</p>
        <div id="pm-list" class="pm-list"></div>
        <p id="pm-empty" class="chip mb-0" hidden>曲目库还是空的，先去「曲目」页建一条</p>
      </div>
      <div class="modal-footer py-1">
        <button class="go go-ghost go-sm" data-bs-dismiss="modal">取消</button>
        <button class="go go-sm" id="pm-save">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
let sections = [];
let me = null;
const dayNames = ['一', '二', '三', '四', '五', '六', '日'];

/**
 * 「这场活动我能不能改」——与后端 `EventService.checkEditPermission` 同一套口径：
 * 声部课＝管理员/团长/本声部声部长；其余＝管理员/团长/指挥。
 * ⚠️ 这里只是**别显示点了必然 403 的按钮**，真闸门在服务端。
 */
function canEditEvent(event) {
  if (event.kind === 'SECTION_CLASS') {
    return ['ADMIN', 'LEADER'].includes(me.role)
      || (me.role === 'SECTION_LEADER' && me.sectionId != null && me.sectionId === event.sectionId);
  }
  return ['ADMIN', 'LEADER', 'CONDUCTOR'].includes(me.role);
}

function syncSectionSelect(kind, select) {
  select.disabled = kind !== 'SECTION_CLASS';
}

async function load() {
  me = await BAND.renderNav('admin-events.html');
  if (!me) return;
  sections = await BAND.must('/api/sections');
  const options = '<option value="">无声部</option>' +
    sections.map((s) => `<option value="${s.id}">${s.name}</option>`).join('');
  document.getElementById('k-section').innerHTML = options;
  document.getElementById('b-section').innerHTML = options;
  document.getElementById('k-kind').addEventListener('change',
    (e) => syncSectionSelect(e.target.value, document.getElementById('k-section')));
  document.getElementById('b-kind').addEventListener('change',
    (e) => syncSectionSelect(e.target.value, document.getElementById('b-section')));
  document.getElementById('b-weekdays').innerHTML = dayNames
    .map((n, i) => `<div class="form-check"><input class="form-check-input" type="checkbox" value="${i + 1}" id="wd${i}">
      <label class="form-check-label chip" for="wd${i}">${n}</label></div>`).join('');
  await loadRows();
}

async function loadRows() {
  const d = await BAND.must('/api/events?size=100');
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  for (const e of d.list) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td><td></td><td></td><td></td><td><span class="chip"></span></td><td class="act"></td>';
    tr.children[0].textContent = e.date;
    tr.children[1].textContent = BAND.kindLabel(e.kind);
    const title = tr.children[2];
    if (e.status === 'CANCELED') {
      const s = document.createElement('s');
      s.textContent = e.title;
      title.appendChild(s);
    } else {
      title.textContent = e.title;
    }
    tr.children[3].textContent = `${e.startTime.slice(0, 5)}-${e.endTime.slice(0, 5)} ${e.location || ''}`;
    tr.children[4].textContent = e.sectionName || '';
    tr.querySelector('.chip').textContent = e.status === 'CANCELED' ? '已取消' : '';
    if (e.status !== 'CANCELED' && canEditEvent(e)) {
      const piecesBtn = document.createElement('button');
      piecesBtn.className = 'go go-ghost go-sm me-1';
      piecesBtn.textContent = '曲目单';
      piecesBtn.addEventListener('click', () => openPiecesModal(e));
      tr.children[6].appendChild(piecesBtn);

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'go go-ghost go-sm';
      cancelBtn.textContent = '取消';
      cancelBtn.addEventListener('click', async () => {
        if (!confirm(`取消「${e.title}」${e.date}？签到将关闭，统计整场排除。`)) return;
        await BAND.must(`/api/events/${e.id}/cancel`, { method: 'POST' });
        BAND.toast('已取消', 'success');
        loadRows();
      });
      tr.children[6].appendChild(cancelBtn);
    }
    tbody.appendChild(tr);
  }
  BAND.alive(document.getElementById('admin-events-table'));   // 「列表逐行入场」（docs/14 §14.6.4 ③）
}

let piecesTarget = null;

/** 曲目单：勾选顺序即练习顺序（列表按勾选先后重排，提交时就是这个数组）。 */
async function openPiecesModal(event) {
  piecesTarget = event.id;
  document.getElementById('pm-title').textContent = `${event.title} · ${event.date}`;
  const all = await BAND.must('/api/pieces?size=100');
  const current = (await BAND.must(`/api/events/${event.id}/pieces`)).map((p) => p.pieceId);
  const host = document.getElementById('pm-list');
  const ordered = current
    .map((pid) => all.list.find((p) => p.id === pid))
    .filter(Boolean)
    .concat(all.list.filter((p) => !current.includes(p.id)));
  document.getElementById('pm-empty').hidden = ordered.length > 0;
  host.innerHTML = '';
  ordered.forEach((p) => {
    const row = document.createElement('label');
    row.className = 'd-flex align-items-center gap-2 py-1';
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.value = p.id;
    box.checked = current.includes(p.id);
    const name = document.createElement('span');
    name.textContent = `${p.title}${p.composer ? ' · ' + p.composer : ''}（${p.statusLabel}）`;
    row.append(box, name);
    host.appendChild(row);
  });
  bootstrap.Modal.getOrCreateInstance(document.getElementById('pieces-modal')).show();
}

document.getElementById('pm-save').addEventListener('click', async () => {
  const picked = [...document.querySelectorAll('#pm-list input:checked')].map((b) => Number(b.value));
  await BAND.must(`/api/events/${piecesTarget}/pieces`, {
    method: 'PUT',
    body: { pieceIds: picked },
  });
  bootstrap.Modal.getInstance(document.getElementById('pieces-modal')).hide();
  BAND.toast('曲目单已保存', 'success');
});

document.getElementById('single-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const sectionValue = document.getElementById('k-section').value;
  const body = {
    kind: document.getElementById('k-kind').value,
    title: document.getElementById('k-title').value.trim(),
    date: document.getElementById('k-date').value,
    startTime: document.getElementById('k-start').value,
    endTime: document.getElementById('k-end').value,
    location: document.getElementById('k-location').value.trim() || null,
    sectionId: sectionValue ? Number(sectionValue) : null,
  };
  await BAND.must('/api/events', { method: 'POST', body });
  BAND.toast('已创建', 'success');
  loadRows();
});

document.getElementById('batch-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const weekdays = [...document.querySelectorAll('#b-weekdays input:checked')].map((i) => Number(i.value));
  if (weekdays.length === 0) { BAND.toast('至少选一个星期几'); return; }
  const sectionValue = document.getElementById('b-section').value;
  const body = {
    kind: document.getElementById('b-kind').value,
    title: document.getElementById('b-title').value.trim(),
    startDate: document.getElementById('b-from').value,
    endDate: document.getElementById('b-to').value,
    weekdays,
    startTime: document.getElementById('b-start').value,
    endTime: document.getElementById('b-end').value,
    location: document.getElementById('b-location').value.trim() || null,
    sectionId: sectionValue ? Number(sectionValue) : null,
  };
  const created = await BAND.must('/api/events/batch', { method: 'POST', body });
  BAND.toast(`已生成 ${created.length} 场`, 'success');
  loadRows();
});

load();
</script>
</body>
</html>
