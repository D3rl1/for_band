<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>请假审批 · 乐团管理系统</title>
<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/app.js"></script>
</head>
<body class="nav-collapsed">
<div id="navbar"></div>

<h2 class="mb-3">待我审批</h2>
<div id="pending"></div>
<p id="pending-empty" class="py-3" hidden>没有等你审批的申请</p>

<h2 class="mt-4 mb-3">全部申请（角色范围内）</h2>
<table class="tb">
  <thead><tr><th>日期</th><th>活动</th><th>申请人</th><th>声部</th><th>状态</th><th>进度</th></tr></thead>
  <tbody id="all-rows"></tbody>
</table>

<script>
const reqStatus = { PENDING: '待审批', APPROVED: '已通过', REJECTED: '已驳回', CANCELED: '已撤回' };

function progressText(r) {
  return r.approvals
    .map((a) => `${a.requiredRole === 'LEADER' ? '团长' : '声部长'}：${
      a.decision === 'APPROVED' ? '已批' : a.decision === 'REJECTED' ? '已驳回' : '未批'
    }${a.approverName ? '（' + a.approverName + '）' : ''}${a.note ? ' ' + a.note : ''}`)
    .join(' · ');
}

function card(r) {
  const el = document.createElement('div');
  el.className = 'cell mb-3';
  const head = document.createElement('div');
  head.className = 'd-flex justify-content-between align-items-center';
  const title = document.createElement('h2');
  title.className = 'mb-0';
  title.textContent = `${r.memberName} · ${r.eventTitle}`;
  head.appendChild(title);
  const state = document.createElement('span');
  state.className = 'chip' + (r.overdue || r.status === 'REJECTED' ? ' warn' : '');
  state.textContent = r.overdue ? '逾期未批（已按缺勤计）' : reqStatus[r.status];
  head.appendChild(state);
  el.appendChild(head);

  const meta = document.createElement('p');
  meta.className = 'chip mb-0 mt-2';
  meta.textContent = `${r.eventDate}${r.reason ? ' · ' + r.reason : ''} · ` + progressText(r);
  el.appendChild(meta);

  const mine = r.approvals.filter((a) => a.iCanDecide);
  if (mine.length > 0 && r.status === 'PENDING') {
    const note = document.createElement('input');
    note.className = 'mt-3 w-100';
    note.placeholder = '审批意见（可空）';
    const btns = document.createElement('div');
    btns.className = 'mt-2 d-flex gap-2';
    for (const [label, cls, decision] of [['批准', '', 'APPROVED'], ['驳回', 'go-ghost', 'REJECTED']]) {
      const btn = document.createElement('button');
      btn.className = `go go-sm ${cls}`;
      btn.textContent = label;
      btn.addEventListener('click', async () => {
        if (decision === 'REJECTED' && !confirm(`驳回 ${r.memberName} 的申请？整单将立即驳回。`)) return;
        await BAND.must(`/api/leave-approvals/${mine[0].id}/decide`, {
          method: 'POST',
          body: { decision, note: note.value.trim() || null },
        });
        BAND.toast('已处理', 'success');
        load();
      });
      btns.appendChild(btn);
    }
    el.appendChild(note);
    el.appendChild(btns);
  }
  return el;
}

async function load() {
  const me = await BAND.renderNav('approve-leave.html');
  if (!me) return;
  const pending = await BAND.must('/api/leave-requests?scope=needsMe&status=PENDING&size=50');
  const host = document.getElementById('pending');
  host.innerHTML = '';
  document.getElementById('pending-empty').hidden = pending.list.length > 0;
  for (const r of pending.list) host.appendChild(card(r));

  const all = await BAND.must('/api/leave-requests?scope=all&size=100');
  const tbody = document.getElementById('all-rows');
  tbody.innerHTML = '';
  for (const r of all.list) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td><td></td><td></td><td><span class="chip"></span></td><td></td>';
    tr.children[0].textContent = r.eventDate;
    tr.children[1].textContent = r.eventTitle;
    tr.children[2].textContent = r.memberName;
    tr.children[3].textContent = r.sectionName || '';
    const chip = tr.querySelector('.chip');
    chip.textContent = r.overdue ? '逾期未批' : reqStatus[r.status];
    if (r.overdue || r.status === 'REJECTED') chip.classList.add('warn');
    tr.children[5].textContent = r.approvals
      .map((a) => `${a.requiredRole === 'LEADER' ? '团长' : '声部长'} ${
        a.decision === 'APPROVED' ? '已批' : a.decision === 'REJECTED' ? '已驳' : '未批'}`)
      .join(' / ');
    tbody.appendChild(tr);
  }
}
load();
</script>
</body>
</html>
