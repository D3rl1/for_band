<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>请假审批 · 乐团管理系统</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#13211D">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="山水乐团">

<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/band-alive.js"></script>
<script src="/band-core.js"></script>
<script src="/band-media.js"></script>
<script src="/band-notify.js"></script>
<script src="/band-profile.js"></script>
<script src="/band-shell.js"></script>
<script src="/band-welcome.js"></script>
</head>
<body>
<div id="navbar"></div>

<!-- ══ 外观控件行（docs/14 §14.6.2b；键沿用 band.palette / band.theme）══ -->
<div class="ev-appbar">
  <span class="ev-today">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
    <b id="today-txt">今天</b>
  </span>
  <button class="ticon" id="theme-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="配色方案" title="配色">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="9.5" cy="10" r="1.1" fill="currentColor"/><circle cx="14.5" cy="10" r="1.1" fill="currentColor"/><circle cx="12" cy="14.4" r="1.1" fill="currentColor"/></svg>
  </button>
  <button class="ticon" id="night-btn" type="button" aria-pressed="false" aria-label="切换到深色" title="深浅色">
    <svg id="night-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.4 6.4 0 0 0 10.5 10.5Z"/></svg>
  </button>
  <div class="ev-pop" id="theme-pop" role="dialog" aria-label="配色方案" hidden>
    <div class="pop-h">配色<span class="pop-cur" id="pop-cur">墨·青</span></div>
    <div class="seedrow" id="palette" role="group" aria-label="配色方案">
      <button class="seedswatch on" type="button" data-p="jade"   title="墨·青" aria-pressed="true"></button>
      <button class="seedswatch"    type="button" data-p="teal"   title="墨·松" aria-pressed="false"></button>
      <button class="seedswatch"    type="button" data-p="violet" title="墨·紫" aria-pressed="false"></button>
      <button class="seedswatch"    type="button" data-p="olive"  title="墨·缃" aria-pressed="false"></button>
      <button class="seedswatch"    type="button" data-p="clay"   title="墨·赭" aria-pressed="false"></button>
      <button class="seedswatch"    type="button" data-p="ink"    title="纯墨"  aria-pressed="false"></button>
    </div>
  </div>
</div>

<!-- 请假审批（docs/05 §5.5 / docs/14 §14.6.4，交接单 #204）：屏二。
     上块＝待我审批的卡（每条申请有几个审批槽就画几枚印；我能签的那一槽加环）；
     下块＝角色范围内的全部申请（客户端六枚药丸筛选）。
     ⚠️ 只有 `status === PENDING` 且 `approvals` 里有 `iCanDecide` 的槽，才给意见框和批准 / 驳回；
        其余（逾期未批但已无待签槽 / 已处理）只读。 -->
<div class="ev-lhead">
  <span class="sec"><h2>待我审批</h2><span class="sub" id="pend-count"></span></span>
</div>
<div class="at-pcs" id="pending"></div>
<div class="ev-empty" id="pending-empty">
  <span class="ic">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.2V3h6v1.2M9 11l2 2 4-4.4"/></svg>
  </span>
  <b>没有等你审批的申请</b>
  <span>有新申请时会出现在这里</span>
</div>

<div class="ev-lhead at-sec-gap">
  <span class="sec"><h2>全部申请</h2><span class="sub" id="all-count">我的角色范围内</span></span>
</div>
<div class="ev-filters" id="allfilter" role="group" aria-label="按状态筛选"></div>
<div class="ev-rows" id="allrows"></div>
<div class="ev-empty" id="all-empty">
  <span class="ic">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v3M16 3v3M9 14h6"/></svg>
  </span>
  <b>没有符合条件的申请</b>
  <span>换个筛选看看</span>
</div>

<script>
'use strict';

const WD = ['日', '一', '二', '三', '四', '五', '六'];
/* 后端 `requiredRole` 存的是 Role 枚举名（LeaveService.create:93-95），不是中文。 */
const ROLE_LABEL = { SECTION_LEADER: '声部长', LEADER: '团长' };
const FILTERS = [
  ['all', '全部'],
  ['PENDING', '待审批'],
  ['APPROVED', '已通过'],
  ['REJECTED', '已驳回'],
  ['CANCELED', '已撤回'],
  ['overdue', '逾期未批'],
];

let pending = [];
let all = [];
let allTotal = 0;
let allFilter = 'all';

const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function dparts(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  if (!m) return { d: iso || '—', w: '' };
  const dt = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return { d: Number(m[2]) + '/' + Number(m[3]), w: '周' + WD[dt.getDay()] };
}
function statusOf(r) {
  if (r.overdue) return { cls: 'no', text: '逾期未批 · 已按缺勤计' };
  return ({
    PENDING: { cls: 'pending', text: '待审批' },
    APPROVED: { cls: 'ok', text: '已通过' },
    REJECTED: { cls: 'no', text: '已驳回' },
    CANCELED: { cls: 'done', text: '已撤回' },
  })[r.status] || { cls: 'pending', text: r.status || '—' };
}
/* 我能签的槽：`PENDING` 且 `iCanDecide`。整单已结束（通过 / 驳回 / 撤回）时不再给操作。 */
function mineIdxOf(r) {
  if (r.status !== 'PENDING') return null;
  const i = (r.approvals || []).findIndex((a) => a.iCanDecide);
  return i >= 0 ? i : null;
}
/* 双签章：几个审批槽就画几枚。印跟状态变色是「印本来就该是朱砂」的明确例外（docs/14，用户 2026-10-15 拍板）；
   **姓名一律墨色**（红笔写活人名犯忌），红只留给「✕ 已驳回」几个字。 */
function sealsNode(r, mineIdx) {
  const box = el('div', 'at-seals');
  (r.approvals || []).forEach((a, i) => {
    const cls = a.decision === 'APPROVED' ? ' ok' : a.decision === 'REJECTED' ? ' no' : '';
    const mine = (mineIdx != null && i === mineIdx) ? ' mine' : '';
    const seal = el('div', 'at-seal' + cls + mine);
    seal.appendChild(el('span', 'r', ROLE_LABEL[a.requiredRole] || a.requiredRole || '审批'));
    const v = el('span', 'v');
    if (a.decision === 'APPROVED') {
      v.appendChild(document.createTextNode('✓ 已批'));
      v.appendChild(el('span', 'who', a.approverName || '—'));
    } else if (a.decision === 'REJECTED') {
      v.appendChild(document.createTextNode('✕ 已驳回'));
      v.appendChild(el('span', 'who', a.approverName || '—'));
    } else {
      v.appendChild(document.createTextNode('未批'));
    }
    if (a.note) v.appendChild(el('span', 'note', a.note));
    seal.appendChild(v);
    box.appendChild(seal);
  });
  return box;
}

/* ---------- 上块 · 待我审批 ---------- */
function pendCard(r) {
  const dp = dparts(r.eventDate);
  const st = statusOf(r);
  const mineIdx = mineIdxOf(r);
  const card = el('article', 'at-pc');
  card.dataset.id = r.id;

  const hd = el('div', 'hd');
  const left = el('div');
  const title = el('div', 'at-t');
  title.appendChild(document.createTextNode(`${r.memberName || '—'} · ${r.eventTitle || '（未命名活动）'}`));
  if (r.eventKind) title.appendChild(el('span', 'at-kind', BAND.kindLabel(r.eventKind)));
  left.appendChild(title);
  const bits = [`${dp.d} ${dp.w}`];
  if (r.sectionName) bits.push(r.sectionName);
  bits.push('理由：' + (r.reason || '—'));
  left.appendChild(el('div', 'at-meta', bits.join(' · ')));
  hd.appendChild(left);
  hd.appendChild(el('span', 'at-st ' + st.cls, st.text));
  card.appendChild(hd);
  card.appendChild(sealsNode(r, mineIdx));

  if (mineIdx != null) {
    const note = el('input', 'at-note');
    note.type = 'text';
    note.placeholder = '审批意见（可空）';
    note.setAttribute('aria-label', '审批意见');
    card.appendChild(note);

    const acts = el('div', 'at-acts');
    const ok = el('button', 'go go-sm', '批准');
    ok.type = 'button';
    const no = el('button', 'go go-sm go-danger', '驳回');
    no.type = 'button';
    const decide = async (decision) => {
      if (decision === 'REJECTED'
          && !await BAND.confirm({ title: `驳回 ${r.memberName} 的申请？`, body: '整单将立即驳回。' })) return;
      ok.disabled = true;
      no.disabled = true;
      try {
        const res = await BAND.must(`/api/leave-approvals/${r.approvals[mineIdx].id}/decide`, {
          method: 'POST',
          body: { decision, note: note.value.trim() || null },
        });
        // 覆盖了一条已有签到必须**当场说清**（docs/05 §5.5：留痕 + 当场提示，缺一不可，不许静默）
        BAND.toast(res && res.attendanceOverridden
          ? `${r.memberName} 已签到，其考勤已改为请假`
          : (decision === 'APPROVED' ? '已批准' : '已驳回'), 'success');
        await load();
      } catch (e) {
        ok.disabled = false;
        no.disabled = false;   // toast 已由 must 弹出
      }
    };
    ok.addEventListener('click', () => decide('APPROVED'));
    no.addEventListener('click', () => decide('REJECTED'));
    acts.append(ok, no);
    card.appendChild(acts);
  }
  return card;
}

/* ---------- 下块 · 全部申请 ---------- */
function matchAll(r) {
  if (allFilter === 'all') return true;
  if (allFilter === 'overdue') return !!r.overdue;
  if (allFilter === 'PENDING') return r.status === 'PENDING' && !r.overdue;
  return r.status === allFilter;
}
function countAll(k) {
  if (k === 'all') return all.length;
  return all.filter((r) => (k === 'overdue' ? !!r.overdue
    : (k === 'PENDING' ? (r.status === 'PENDING' && !r.overdue) : r.status === k))).length;
}
function allRow(r) {
  const dp = dparts(r.eventDate);
  const st = statusOf(r);
  const row = el('article', 'at-lr');
  row.dataset.id = r.id;
  row.dataset.st = r.overdue ? 'overdue' : r.status;

  const db = el('div', 'at-db');
  db.appendChild(el('span', 'd', dp.d));
  db.appendChild(el('span', 'w', dp.w));
  row.appendChild(db);

  const body = el('div', 'at-body');
  const top = el('div', 'at-top');
  const left = el('div');
  const title = el('div', 'at-t');
  title.appendChild(document.createTextNode(`${r.memberName || '—'} · ${r.eventTitle || '（未命名活动）'}`));
  if (r.eventKind) title.appendChild(el('span', 'at-kind', BAND.kindLabel(r.eventKind)));
  left.appendChild(title);
  left.appendChild(el('div', 'at-meta', `${r.sectionName || '—'} · 理由：${r.reason || '—'}`));
  top.appendChild(left);

  const ops = el('div', 'at-ops');
  ops.appendChild(el('span', 'at-st ' + st.cls, st.text));
  top.appendChild(ops);

  body.appendChild(top);
  body.appendChild(sealsNode(r, mineIdxOf(r)));
  row.appendChild(body);
  return row;
}
function renderAllFilters() {
  const host = $('allfilter');
  host.innerHTML = '';
  for (const [k, label] of FILTERS) {
    const b = el('button', 'fchip', `${label} ${countAll(k)}`);
    b.type = 'button';
    b.dataset.f = k;
    b.setAttribute('aria-pressed', String(allFilter === k));
    b.addEventListener('click', () => {
      if (allFilter === k) return;
      allFilter = k;
      renderAllFilters();
      renderAll();
    });
    host.appendChild(b);
  }
}
function renderAll() {
  const rows = all.filter(matchAll);
  $('all-count').textContent = allTotal > all.length
    ? `已显示 ${all.length} / 共 ${allTotal} 条`
    : (allFilter === 'all' ? `共 ${all.length} 条` : `${rows.length} / ${all.length} 条`);
  $('all-empty').classList.toggle('show', rows.length === 0);
  const host = $('allrows');
  host.innerHTML = '';
  rows.forEach((r) => host.appendChild(allRow(r)));
}

/* ---------- 载入 ---------- */
async function load() {
  const me = await BAND.renderNav('approve-leave.html');
  if (!me) return;

  const [pend, a] = await Promise.all([
    BAND.must('/api/leave-requests?scope=needsMe&status=PENDING&size=50'),
    BAND.must('/api/leave-requests?scope=all&size=100'),
  ]);

  pending = pend.list || [];
  $('pend-count').textContent = `${pending.length} 条`;
  $('pending-empty').classList.toggle('show', pending.length === 0);
  const host = $('pending');
  host.innerHTML = '';
  pending.forEach((r) => host.appendChild(pendCard(r)));

  all = a.list || [];
  allTotal = a.total || all.length;
  renderAllFilters();
  renderAll();

  BAND.alive(host, $('allrows'));
}

/* 配色 / 深浅控件由 `BAND.appearance` 统一接线（band-core.js），`band-shell` 负责挂载（#239）。 */
function renderToday() {
  const d = new Date();
  $('today-txt').textContent = `${d.getMonth() + 1} 月 ${d.getDate()} 日 · 周${WD[d.getDay()]}`;
}

renderToday();
load();
</script>
</body>
</html>
