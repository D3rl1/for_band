<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>团员主页 · 乐团管理系统</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#13211D">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/pwa-252/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/pwa-252/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="山水乐团">

<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/band-alive.js"></script>
<script src="/band-core.js"></script>
<script src="/band-media.js"></script>
<script src="/band-notify.js"></script>
<script src="/band-profile.js"></script>
<script src="/band-shell.js"></script>
<script src="/band-welcome.js"></script>
</head>
<body>
<div id="navbar"></div>

<!-- 与 `profile.html` 共用同一套 `.pf-*` 名片（同一块 `mountShowcaseCount`、同一句 `identityTags`）。 -->
<article class="pf-card" id="pf-card">
  <div class="pf-av" id="big-av"></div>
  <div class="pf-id">
    <div class="pf-name" id="big-name"></div>
    <div class="pf-tags" id="big-tags"></div>
    <!-- ⭐ 「参演过 N 场专场」（`交接单 #117`）。**这是给别人看的**，所以只放这一个数。
         ⚠️ **0 也显示 `0`**（不是 `—`）——那是事实。 -->
    <div class="pf-show">参演过 <b id="showcase-n">—</b> 场专场</div>
    <p class="pf-intro" id="d-intro"></p>
    <div class="pf-facts two">
      <div class="pf-fact"><div class="k">生 日</div><div class="v" id="d-birthday">—</div></div>
      <div class="pf-fact"><div class="k">入 团</div><div class="v" id="d-joined">—</div></div>
    </div>
  </div>
</article>

<!-- 「最近来看过我的人」：**只在看自己的主页时出现**（docs/14 §14.6.4）。看别人时连请求都不发。 -->
<section class="pf-visits" id="cell-visits" hidden>
  <div class="card-h">
    <h2>最近来看过我的人</h2>
    <button id="v-clear" class="go go-ghost go-sm" type="button" hidden>清空记录</button>
  </div>
  <p class="pf-fine">一天只记一条：谁 · 哪天来过。</p>
  <ul class="pf-vlist" id="v-list"></ul>
  <p class="pf-vempty" id="v-empty" hidden>还没有人来看过</p>
</section>

<script>
'use strict';

let me = null;

const el = (id) => document.getElementById(id);

/** 谁来看过我（倒序）。⚠️ **只说"谁 · 哪天来过"**，不说"来了几次"——去重粒度就是一天一条。 */
async function loadVisits() {
  const d = await BAND.must('/api/me/profile-visits?page=1&size=20');
  const list = el('v-list');
  list.innerHTML = '';
  for (const v of d.list) {
    const li = document.createElement('li');
    li.className = 'pf-visit';

    const av = document.createElement('span');
    av.className = 'pf-vav';
    av.textContent = Array.from(v.viewerName || '?')[0];

    const nm = document.createElement('span');
    nm.className = 'pf-vn';
    nm.textContent = v.viewerName;

    const tm = document.createElement('span');
    tm.className = 'pf-vt';
    tm.textContent = v.visitDate === BAND.localDayKey() ? '今天来过' : v.visitDate + ' 来过';

    li.append(av, nm, tm);
    list.appendChild(li);
  }
  el('v-empty').hidden = d.list.length > 0;
  el('v-clear').hidden = d.list.length === 0;
}

el('v-clear').addEventListener('click', async () => {
  const yes = await BAND.confirm({
    title: '清空访客记录？',
    body: '清掉之后就看不到"谁来过"了，而且不能恢复。',
    ok: '清 空',
  });
  if (!yes) return;
  await BAND.must('/api/me/profile-visits', { method: 'DELETE' });
  BAND.toast('已清空访客记录', 'success');
  await loadVisits();
});

async function load() {
  me = await BAND.renderNav('member-detail.html');
  if (!me) return;
  const id = new URLSearchParams(location.search).get('id');
  // ⚠️ 接口是 `GET /api/members/{id}`，**不是** `/api/me/profile` —— 后者不许收 memberId
  //    （docs/03 §3.3 写死的红线：收了就等于开了水平越权）。
  const m = await BAND.must('/api/members/' + encodeURIComponent(id || ''));
  BAND.paintAvatar(el('big-av'), m);
  el('big-name').textContent = m.name;
  el('big-tags').textContent = BAND.identityTags(m);
  await BAND.mountShowcaseCount(el('showcase-n'), m.id);

  // ⚠️ **前端不自己判角色**（docs/14 §14.6.4）：服务端裁完什么就显示什么。
  //    这里拿到的生日本来就只到「月-日」、学号与管理员备注本来就没了。
  const intro = el('d-intro');
  intro.textContent = m.intro || '还没有简介';
  intro.classList.toggle('empty', !m.intro);
  el('d-birthday').textContent = m.birthday || '未填';
  el('d-joined').textContent = m.joinedAt ? String(m.joinedAt).slice(0, 10) : '—';

  if (String(me.id) === String(id)) {
    el('cell-visits').hidden = false;
    await loadVisits();
  }
}

load();
</script>
</body>
</html>
