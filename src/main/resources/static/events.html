<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活动 · 乐团管理系统</title>
<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/band-alive.js"></script>
<script src="/band-core.js"></script>
<script src="/band-media.js"></script>
<script src="/band-notify.js"></script>
<script src="/band-profile.js"></script>
<script src="/band-shell.js"></script>
<script src="/band-welcome.js"></script>
</head>
<body>

<!-- 欢迎过渡黑幕（docs/14 §14.6.4）：**必须内联在 body 最前**，登录成功那次首帧就铺黑。
     平时由 <html> 上的 wel-armed 类（band-nav.js 首帧前决定）保持 display:none，不闪黑。
     内容由 app.js playWelcome 填充。 -->
<div class="wel" id="wel" aria-hidden="true">
  <div class="wel-av"></div>
  <div class="wel-tx">欢迎回来，<span class="wname"></span></div>
</div>


<div id="navbar"></div>

<section class="grid mb-4" id="bento">
  <div class="cell hero">
    <div class="lab">下一场</div>
    <h2 id="hero-title">—</h2>
    <p class="when" id="hero-when"></p>
    <div class="act"><a class="go" id="hero-go" href="#">签 到</a></div>
  </div>
  <div class="cell wide">
    <div class="lab">这周的谱</div>
    <div class="score" id="score"></div>
  </div>
  <!-- ⭐ s1 从"只有出勤率一个数"改成**数字三连**（`docs/14` §14.6.4 九·b / `交接单 #117`）：
       我的录音数 / 我的出勤场次 / 在团天数。⚠️ **三个数各自在自己的元素里**——
       数字滚动（「界面的活性」①）要求如此，挤在一个元素里会串。
       出勤率没有消失，它还在考勤统计页（这一格换成"成就感"的三个数）。 -->
  <div class="cell s1">
    <div class="lab">我的</div>
    <div class="mine-nums">
      <div class="mn"><p class="big" id="n-rec" data-count>—</p><em>录音</em></div>
      <div class="mn"><p class="big" id="n-att" data-count>—</p><em>出勤场次</em></div>
      <div class="mn"><p class="big" id="n-days" data-count>—</p><em>在团天数</em></div>
    </div>
  </div>
  <div class="cell s2">
    <div class="lab">待办</div>
    <p class="big" id="todo-big" data-count>0</p>
    <p class="mb-0 text-nowrap" id="todo-note" hidden></p>
  </div>
</section>

<h2 class="mb-3">活动安排</h2>
<div class="d-flex gap-2 mb-3 filters">
  <select id="kind" class="w-auto">
    <option value="">全部类型</option>
    <option value="REHEARSAL">排练</option>
    <option value="SECTION_CLASS">声部课</option>
    <option value="DRESS_REHEARSAL">彩排</option>
  </select>
</div>
<table class="tb" id="events-table">
  <thead><tr><th>日期</th><th>类型</th><th>标题</th><th>时间</th><th>声部</th><th>状态</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<p id="empty" class="py-4" hidden>暂无活动</p>

<script>
const KIND_LV = { REHEARSAL: 1, SECTION_CLASS: 2, DRESS_REHEARSAL: 3 };
const DAY_NAMES = ['一', '二', '三', '四', '五', '六', '日'];

function whenText(e) {
  return `${e.date.slice(5).replace('-', ' 月 ')} 日 ${e.startTime.slice(0, 5)}–${e.endTime.slice(0, 5)}` +
    (e.location ? ` · ${e.location}` : '');
}

async function load() {
  const me = await BAND.renderNav('events.html');
  if (!me) return;

  const kind = document.getElementById('kind').value;
  const d = await BAND.must(`/api/events?size=100${kind ? '&kind=' + kind : ''}`);
  // ⚠️ 等两个汇总都写进 DOM 之后才播「活性」——它们没写完就播，快照到的是 `—` / 空点阵，
  // 而"播过"的标志一置位就**再也不播**了（docs/14 §14.6.4 ③"只在首次出现数一次"的前提）
  await renderBento(me, d.list);
  renderList(d.list);
  BAND.alive(document.getElementById('bento'), document.getElementById('events-table'));
}

async function renderBento(me, list) {
  // 主角格：下一场（未取消、未开始的最近一场）
  const now = Date.now();
  const upcoming = list
    .filter((e) => e.status !== 'CANCELED' && new Date(`${e.date}T${e.startTime}`) > now)
    .sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
  const heroTitle = document.getElementById('hero-title');
  const heroGo = document.getElementById('hero-go');
  if (upcoming.length > 0) {
    const next = upcoming[0];
    heroTitle.textContent = next.title;
    document.getElementById('hero-when').textContent = whenText(next);
    heroGo.href = `/event-detail.html?id=${next.id}`;
    heroGo.hidden = false;
  } else {
    heroTitle.textContent = '暂无安排';
    document.getElementById('hero-when').textContent = '';
    heroGo.hidden = true;
  }

  // 这周的谱：本周一~周日，块高低 = 活动类型；空白日写休止符 0
  const today = new Date();
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const byDay = {};
  list.filter((e) => e.status !== 'CANCELED').forEach((e) => {
    const diff = Math.round((new Date(`${e.date}T12:00`) - new Date(monday)) / 86400000);
    if (diff >= 0 && diff < 7) {
      byDay[diff] = byDay[diff] || [];
      byDay[diff].push(e);
    }
  });
  const score = document.getElementById('score');
  score.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const dayEvents = byDay[i];
    const blk = document.createElement('div');
    if (!dayEvents || dayEvents.length === 0) {
      blk.className = 'blk rest';
      blk.style.setProperty('--d', i + 1);
      blk.style.setProperty('--lv', 2);
      blk.textContent = '0';
    } else {
      const top = dayEvents.reduce((m, e) => Math.max(m, KIND_LV[e.kind] || 1), 1);
      blk.className = 'blk';
      blk.style.setProperty('--d', i + 1);
      blk.style.setProperty('--lv', top);
      blk.textContent = BAND.kindLabel(dayEvents[0].kind).slice(0, 1);
    }
    score.appendChild(blk);
  }
  const days = document.createElement('div');
  days.className = 'days';
  days.innerHTML = DAY_NAMES.map((n) => `<i>${n}</i>`).join('');
  score.appendChild(days);

  // 「我的」三个数（录音数 / 出勤场次 / 在团天数）
  // ⚠️ 这两条要 await：调用方（load）要在它们写完 DOM 之后才播「活性」
  await fetchMine(me);
  await renderTodo(me);
}

/** 「我的」那三个数（`docs/14` §14.6.4 九·b，`交接单 #117`）。
 *  ⚠️ 值**直接写终态**：数字滚动会自己从 0 滚上去（`ALIVE.play` 读元素原文当终值）；
 *  拿不到的写 `—`（`specOf` 认不出数字 ⇒ 不数，也不会被滚成 0）。 */
async function fetchMine(me) {
  // ① 我的录音数 ② 我的出勤场次（**与个人栏同一口径**：排练 + 声部课的 present 之和，
  //   用户 2026-09-30 拍板；**不是**"数 attendance 行数"）③ 在团天数（本地算）
  try {
    const [rec, sum] = await Promise.all([
      BAND.must(`/api/recordings?memberId=${me.id}&size=1`),
      BAND.must(`/api/members/${me.id}/attendance-summary`),
    ]);
    document.getElementById('n-rec').textContent = String(rec.total || 0);
    document.getElementById('n-att').textContent =
      String((sum.rehearsal.present || 0) + (sum.sectionClass.present || 0));
  } catch (e) {
    document.getElementById('n-rec').textContent = '—';
    document.getElementById('n-att').textContent = '—';
  }
  document.getElementById('n-days').textContent =
    me.joinedAt ? String(BAND.daysSince(me.joinedAt)) : '—';
}

async function renderTodo(me) {
  const big = document.getElementById('todo-big');
  const note = document.getElementById('todo-note');
  const approver = ['ADMIN', 'LEADER', 'SECTION_LEADER'].includes(me.role);
  const scope = approver ? 'needsMe' : 'mine';
  try {
    const d = await BAND.must(`/api/leave-requests?scope=${scope}&status=PENDING&size=50`);
    big.textContent = d.total;
    note.hidden = false;
    note.textContent = approver ? '请假待我审批' : '我的请假待审批';
  } catch (e) {
    big.textContent = '0';
  }
}

/** 手机端活动行（样张 `v-events` 的 `.ev` 日期块行）：日期块 + 主文 + `›`。
    桌面仍走下面那套 6 列表格，一个字没动（`docs/14` §14.6.4 §三 表第 1 行）。 */
function evRow(e) {
  const tr = document.createElement('tr');
  tr.className = 'link';
  const date = document.createElement('td');
  date.className = 'ev-date';
  const day = document.createElement('b');
  day.textContent = e.date.slice(8, 10);
  const wd = document.createElement('em');
  wd.textContent = '周' + DAY_NAMES[(new Date(`${e.date}T12:00`).getDay() + 6) % 7];
  date.append(day, wd);
  const main = document.createElement('td');
  main.className = 'ev-main';
  const title = document.createElement('b');
  if (e.status === 'CANCELED') {
    const s = document.createElement('s');
    s.textContent = e.title;
    title.appendChild(s);
  } else {
    title.textContent = e.title;
  }
  const meta = document.createElement('span');
  meta.textContent = [
    `${e.startTime.slice(0, 5)}–${e.endTime.slice(0, 5)}`, e.location, e.sectionName,
  ].filter(Boolean).join(' · ');
  main.append(title, meta);
  const go = document.createElement('td');
  go.className = 'ev-go';
  go.textContent = '›';
  tr.append(date, main, go);
  tr.addEventListener('click', () => { location.href = `/event-detail.html?id=${e.id}`; });
  return tr;
}

function renderList(list) {
  const mobile = BAND.isMobile();
  document.getElementById('events-table').classList.toggle('ev-list', mobile);
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  document.getElementById('empty').hidden = list.length > 0;
  for (const e of list) {
    if (mobile) { tbody.appendChild(evRow(e)); continue; }
    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td><td></td><td></td><td></td><td><span class="chip"></span></td>';
    tr.children[0].textContent = e.date;
    tr.children[1].textContent = BAND.kindLabel(e.kind);
    const title = tr.children[2];
    if (e.status === 'CANCELED') {
      const s = document.createElement('s');
      s.textContent = e.title;
      title.appendChild(s);
    } else {
      title.textContent = e.title;
    }
    tr.children[3].textContent = `${e.startTime.slice(0, 5)}–${e.endTime.slice(0, 5)} ${e.location || ''}`;
    tr.children[4].textContent = e.sectionName || '';
    tr.querySelector('.chip').textContent = e.status === 'CANCELED' ? '已取消' : '';
    tr.classList.add('link');
    tr.addEventListener('click', () => { location.href = `/event-detail.html?id=${e.id}`; });
    tbody.appendChild(tr);
  }
}

document.getElementById('kind').addEventListener('change', load);
load();
</script>
</body>
</html>
