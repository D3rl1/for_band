<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>演出 · 乐团管理系统</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#13211D">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/pwa-252/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/pwa-252/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="山水乐团">

<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/band-alive.js"></script>
<script src="/band-core.js"></script>
<script src="/band-media.js"></script>
<script src="/band-notify.js"></script>
<script src="/band-profile.js"></script>
<script src="/band-shell.js"></script>
<script src="/band-welcome.js"></script>
</head>
<body>
<div id="navbar"></div>

<!-- ══ 外观控件行（活动页 + 演出页，docs/14 §14.6.2b）══
     今天 + 配色（popover）/ 深浅两个图标按钮。键沿用 `band.palette` / `band.theme`（band-nav.js 首帧读回）。
     ⚠️ 页面里**零内联 style 定色**（AGENTS.md）：配色入口现在是 `/theme.html` 的真实链接；页面不再保留配色弹层。 -->
<div class="ev-appbar">
  <span class="ev-today">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
    <b id="today-txt">今天</b>
  </span>
  <a class="ticon" id="theme-btn" href="/theme.html" aria-label="主题设置" title="主题设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="9.5" cy="10" r="1.1" fill="currentColor"/><circle cx="14.5" cy="10" r="1.1" fill="currentColor"/><circle cx="12" cy="14.4" r="1.1" fill="currentColor"/></svg>
  </a>
  <button class="ticon" id="night-btn" type="button" aria-pressed="false" aria-label="切换到深色" title="深浅色">
    <svg id="night-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.4 6.4 0 0 0 10.5 10.5Z"/></svg>
  </button>
</div>

<!-- ⭐ 「我们的专场」的入口（`docs/17` §17.5 + `docs/14` §14.6.4，2026-09-30 `#116`）：
     **占满宽的入口卡**（用户原话「放演出里也可以啊，但是要**显眼**啊，不能摆个小字放那吧」）——
     主视觉用**历届专场自己的东西**（这里是**年份墙**：纯文字的年份 chips，不新画插画）、
     一句导语、一个**明确的进入动作**（不再是光秃秃一个箭头）。
     ⚠️ 卡片本身**不做任何动效**（§14.6.6：不做 hover 浮起、不做循环）；**进门那道编排照旧**。
     ⚠️ 位置仍在页面顶部、**仍不占侧栏菜单项**（页面清单里挂 `offMenuTitles`）。
     ⚠️ `href` 留着（`refresh.sh` 的 `[4/5]` 入口体检认它），点击只拦默认行为 → 先过确认，再演 A 段。
     ⚠️ **红线**：这一条形态**一个字不改**（只让配色跟着墨·青，由别名桥接自动生效）。 -->
<a class="sc-card sc-entry" href="/showcase.html">
  <span class="sc-card-l">
    <span class="sc-card-t">我们的专场</span>
    <span class="sc-card-d">历届专场的时间线 —— 一年一年看下来</span>
    <span class="sc-card-act">进去看看 →</span>
  </span>
  <!-- 年份墙：由 `/api/showcase/timeline` 灌（`<b>` 只放年份数字）。
       ⚠️ `aria-hidden`：它是**装饰性的重复信息**（年份在专页上还要再看一遍），
       留着会让整卡的链接名变成一串年份。 -->
  <span class="sc-years" id="sc-years" aria-hidden="true"></span>
</a>

<!-- 「下一场演出」：一条安静的卡（有未来的、未取消的场次时才出现）。整卡是一个 `<a>`。 -->
<a class="cn-next" id="next" href="#" hidden></a>

<div class="ev-lhead">
  <span class="sec"><h2>演出安排</h2><span class="sub" id="list-count"></span></span>
  <button id="new" class="go go-sm" type="button" hidden>新建演出</button>
</div>

<!-- 按年分组的列表（`renderList` 灌）：一年一个 `.ev-group`，行是 `.cn-crow` 套 `.evrow` -->
<div id="groups"></div>

<div class="ev-empty" id="empty">
  <span class="ic">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 0 0 6v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-6Z"/><path d="M13 4v16" stroke-dasharray="2 2.5"/></svg>
  </span>
  <b>还没有演出记录</b>
  <span>演完一场就把它记下来，以后回看有据可依</span>
</div>

<!-- 新建 / 编辑共用一块表单：新人用「新建」，行内「编辑」把内容填进来 -->
<div class="cell mb-4" id="edit-box" hidden>
  <div class="lab" id="edit-title">新建演出</div>
  <div class="row g-2">
    <div class="col-12 col-md-4"><input id="f-name" class="w-100" maxlength="64" placeholder="演出名*"></div>
    <div class="col-6 col-md-2"><input id="f-date" type="date" class="w-100" required></div>
    <div class="col-6 col-md-2"><input id="f-start" type="time" class="w-100"></div>
    <div class="col-6 col-md-2"><input id="f-venue" class="w-100" maxlength="64" placeholder="地点"></div>
    <div class="col-6 col-md-2"><input id="f-host" class="w-100" maxlength="64" placeholder="主办 / 合作单位"></div>
    <div class="col-12 col-md-4"><input id="f-video" class="w-100" maxlength="255" placeholder="录像链接（B 站 / 网盘）"></div>
    <div class="col-6 col-md-2">
      <select id="f-status" class="w-100">
        <option value="PLANNED">计划中</option>
        <option value="DONE">已完成</option>
        <option value="CANCELED">已取消</option>
      </select>
    </div>
    <div class="col-12"><textarea id="f-summary" rows="2" class="w-100" placeholder="演出总结 / 复盘"></textarea></div>
    <div class="col-12"><input id="f-note" class="w-100" placeholder="备注"></div>
    <div class="col-12 d-flex gap-2">
      <button id="save" class="go go-sm" type="button">保存</button>
      <button id="cancel" class="go go-ghost go-sm" type="button">取消</button>
    </div>
  </div>
</div>

<!-- 入场编排 **A 段**（docs/14 §14.6.4）：黑幕从四面合拢 + 搜索框从下升起（**两件同时**），
     **黑透之后才换纸**到 `showcase.html`，B 段在那儿接着演 ⇒ "换纸"那一下被藏在黑里。
     ⚠️ 层与里面的框/遮罩和 B 段**共用同一套类**，两页接缝才对得上（尺寸、颜色、位置一模一样）。
     ⚠️ **红线**：这一块逐字不动。 -->
<div class="sc-intro sc-intro-a blink" id="sc-intro" data-phase="pre">
  <div class="sc-mask m-t"></div>
  <div class="sc-mask m-b"></div>
  <div class="sc-mask m-l"></div>
  <div class="sc-mask m-r"></div>
  <div class="sc-sbox">
    <svg class="sc-sicon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/>
    </svg>
    <div class="sc-swrap"><span class="sc-caret"></span></div>
    <span class="sc-sline"></span>
  </div>
</div>

<script>
'use strict';

const WD = ['日', '一', '二', '三', '四', '五', '六'];
let me = null;
let canEdit = false;
let editingId = null;

/* 小工具：建元素（值一律走 textContent，不拼 innerHTML） */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

async function load() {
  me = await BAND.renderNav('concerts.html');
  if (!me) return;
  canEdit = ['ADMIN', 'LEADER', 'CONDUCTOR'].includes(me.role);
  document.getElementById('new').hidden = !canEdit;

  const d = await BAND.must('/api/concerts?size=100');
  const list = (d.list || []).slice().sort((a, b) => (b.date + (b.startTime || '')).localeCompare(a.date + (a.startTime || '')));
  document.getElementById('list-count').textContent = `${list.length} 场`;
  renderNext(list);
  renderGroups(list);
  document.getElementById('empty').classList.toggle('show', list.length === 0);
  BAND.alive(document.getElementById('groups'));   // 「列表逐行入场」（docs/14 §14.6.4 ③）
  BAND.navigation.restoreScroll();
}

/* ---------- 下一场演出（未取消、未开始的最近一场） ---------- */
function renderNext(list) {
  const host = document.getElementById('next');
  const now = Date.now();
  const up = list.filter((c) => c.status !== 'CANCELED'
      && new Date(`${c.date}T${c.startTime || '00:00'}`).getTime() > now)
    .sort((a, b) => (a.date + (a.startTime || '')).localeCompare(b.date + (b.startTime || '')));
  if (!up.length) { host.hidden = true; return; }
  const n = up[0];
  host.hidden = false;
  host.href = `/concert-detail.html?id=${n.id}`;
  host.innerHTML = '';
  const db = el('span', 'datebox');
  db.appendChild(el('span', 'd', String(Number(n.date.slice(8, 10)))));
  db.appendChild(el('span', 'w', `${Number(n.date.slice(5, 7))} 月`));
  host.appendChild(db);
  const body = el('span', 'n-body');
  body.appendChild(el('span', 'n-lab', '下一场演出'));
  body.appendChild(el('span', 'n-title', n.name));
  body.appendChild(el('span', 'n-meta',
    [`${n.startTime ? n.startTime.slice(0, 5) : '待定'}`, n.venue, n.host ? `主办：${n.host}` : null].filter(Boolean).join(' · ')));
  host.appendChild(body);
  const t = new Date(); const today = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
  const days = Math.round((new Date(`${n.date}T12:00`) - new Date(`${today}T12:00`)) / 86400000);
  host.appendChild(el('span', 'n-count', days > 0 ? `还有 ${days} 天` : '就在今天'));
}

/* ---------- 按年分组 ---------- */
function renderGroups(list) {
  const host = document.getElementById('groups');
  host.innerHTML = '';
  const byYear = {};
  for (const c of list) (byYear[c.date.slice(0, 4)] = byYear[c.date.slice(0, 4)] || []).push(c);
  for (const y of Object.keys(byYear).sort((a, b) => b.localeCompare(a))) {
    const sec = el('section', 'ev-group');
    const gh = el('div', 'g-h');
    gh.appendChild(el('span', 't', `${y} 年`));
    gh.appendChild(el('span', 'ln'));
    gh.appendChild(el('span', 'c', `${byYear[y].length} 场`));
    sec.appendChild(gh);
    const rows = el('div', 'ev-rows');
    for (const c of byYear[y]) rows.appendChild(cnRow(c));
    sec.appendChild(rows);
    host.appendChild(sec);
  }
}

/* ---------- 一行：`<div class="cn-crow">` 套整行 `<a class="evrow">` + 行内「编辑」按钮 ----------
   ⚠️ **与活动页唯一的形态分叉**：活动页的行是裸 `<a>`（行内没有按钮）；演出行**要能编辑**。
   `<button>` 不能放进 `<a>`（HTML 不允许交互内容套交互内容）⇒ 让 `<a>` 仍当整卡、按钮做**兄弟节点**
   绝对定位在卡内（`.cn-crow.has-edit .evrow` 让出右边距）。中键新标签 / 无 JS 照样能点。
   ⚠️ 状态**常态不挂标签**（跟活动页对齐、守铁律 2）：已取消＝朱砂 `.ev-tag.cancel` + 行删除线；已完成＝灰字；
   「计划中」什么都不挂。 */
function cnRow(c) {
  const wrap = el('div', 'cn-crow');
  const a = el('a', 'evrow' + (c.status === 'CANCELED' ? ' is-cancel' : ''));
  a.href = `/concert-detail.html?id=${c.id}`;

  const db = el('span', 'datebox');
  db.appendChild(el('span', 'd', String(Number(c.date.slice(8, 10)))));
  db.appendChild(el('span', 'w', `${Number(c.date.slice(5, 7))} 月`));
  a.appendChild(db);

  const body = el('span', 'body');
  const title = el('span', 'title');
  title.appendChild(el('b', null, c.name));
  body.appendChild(title);
  const m = el('span', 'meta');
  [c.startTime ? c.startTime.slice(0, 5) : null, c.venue, c.host ? `主办：${c.host}` : null]
    .filter(Boolean).forEach((v, i) => {
      if (i) m.appendChild(el('span', 'sep', '·'));
      m.appendChild(document.createTextNode(v));
    });
  body.appendChild(m);
  body.appendChild(el('span', 'sub', `${c.pieceCount} 首 · ${c.castCount} 人 · ${c.photoCount} 张`));
  a.appendChild(body);

  const st = el('span', 'st');
  if (c.status === 'CANCELED') st.appendChild(el('span', 'ev-tag cancel', '已取消'));
  else if (c.status === 'DONE') st.appendChild(el('span', 'st done', '已完成'));
  a.appendChild(st);

  const chev = el('span', 'chev');
  chev.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 5l7 7-7 7"/></svg>';
  a.appendChild(chev);
  wrap.appendChild(a);

  if (canEdit) {
    const btn = el('button', 'cn-crow-edit', '编辑');
    btn.type = 'button';
    btn.addEventListener('click', (e) => { e.preventDefault(); openEditor(c); });
    wrap.appendChild(btn);
    wrap.classList.add('has-edit');
  }
  return wrap;
}

async function openEditor(concert) {
  editingId = concert ? concert.id : null;
  document.getElementById('edit-box').hidden = false;
  document.getElementById('edit-title').textContent = concert ? `编辑：${concert.name}` : '新建演出';
  let full = concert ? await BAND.must(`/api/concerts/${concert.id}`) : null;
  full = full ? full.concert : null;
  document.getElementById('f-name').value = full ? full.name : '';
  document.getElementById('f-date').value = full ? full.date : '';
  document.getElementById('f-start').value = full && full.startTime ? full.startTime.slice(0, 5) : '';
  document.getElementById('f-venue').value = full ? (full.venue || '') : '';
  document.getElementById('f-host').value = full ? (full.host || '') : '';
  document.getElementById('f-video').value = full ? (full.videoUrl || '') : '';
  document.getElementById('f-status').value = full ? full.status : 'PLANNED';
  document.getElementById('f-summary').value = full && full.summary ? full.summary : '';
  document.getElementById('f-note').value = full && full.note ? full.note : '';
  document.getElementById('f-name').focus();
}

document.getElementById('new').addEventListener('click', () => openEditor(null));
document.getElementById('cancel').addEventListener('click', () => {
  document.getElementById('edit-box').hidden = true;
});
document.getElementById('save').addEventListener('click', async () => {
  const body = {
    name: document.getElementById('f-name').value.trim(),
    date: document.getElementById('f-date').value || null,
    startTime: document.getElementById('f-start').value || null,
    venue: document.getElementById('f-venue').value.trim() || null,
    host: document.getElementById('f-host').value.trim() || null,
    videoUrl: document.getElementById('f-video').value.trim() || null,
    status: document.getElementById('f-status').value,
    summary: document.getElementById('f-summary').value.trim() || null,
    note: document.getElementById('f-note').value.trim() || null,
  };
  if (!body.name || !body.date) {
    BAND.toast('演出名与日期都要填');
    return;
  }
  if (editingId) {
    await BAND.must(`/api/concerts/${editingId}`, { method: 'PUT', body });
  } else {
    await BAND.must('/api/concerts', { method: 'POST', body });
  }
  document.getElementById('edit-box').hidden = true;
  BAND.toast('已保存', 'success');
  load();
});

/* ---------- ⭐ 「我们的专场」入口：一道有仪式感的门槛 + 入场编排 A 段 ----------
   （形态见 docs/14 §14.6.4；A/B 两段怎么拆、为什么拆，见 `17` §17.6）
   ⚠️ 闸门**复用 `BAND.confirm`**（Bootstrap Modal：居中、Esc、点背景都能关），**别另造一套**；
   它在 reduced-motion 下不播入场（Bootstrap 自己把 `.fade` 关掉了），正好满足规格那一条。
   ⚠️ 绑定**在解析期做一次**：`load()` 每次筛选/保存都会被再调用一遍，绑在里面会攒监听。
   ⚠️ **红线**：这一段逻辑逐字不动。 */
(function bindShowcaseEntry() {
  // 年份墙（`#116`）：**纯文字**，取自历届专场自己（`docs/14` §14.6.4「不用新画的插画」）。
  // ⚠️ 它**可能为空**——时间线只收录"有策展图的场次"（`docs/17` §17.4）⇒ 空时就是空的、**不留空块**；
  //    接口挂了也只是没有年份，**不弹错、不挡入口**。跑一次即可（下面那段 IIFE 本来就只跑一次）。
  const years = document.getElementById('sc-years');
  if (years) {
    BAND.api('/api/showcase/timeline').then((env) => {
      const list = env.code === 0 && Array.isArray(env.data) ? env.data : [];
      list.forEach((n) => {
        const b = document.createElement('b');
        b.textContent = String(n.year);
        years.appendChild(b);
      });
    }).catch(() => { /* 没有年份就没有年份，入口照常能进 */ });
  }
  const entry = document.querySelector('.sc-entry');
  const layer = document.getElementById('sc-intro');
  if (!entry || !layer) return;
  entry.addEventListener('click', async (e) => {
    e.preventDefault();
    const go = await BAND.confirm({
      title: '是否要跳转到过去的时间线？',
      body: '会带你回到历届专场，一年一年看下来。',
      ok: '去吧',
      cancel: '再想想',
    });
    if (!go) return;                       // 选"否"什么都不发生，留在原页
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      location.href = '/showcase.html';    // 降级：整段跳过，直接换页
      return;
    }
    document.body.classList.add('cat-off'); // 猫让位：它 z-index 是最大整数，会从黑幕上跑过去
    document.documentElement.style.overflow = 'hidden';
    layer.classList.add('on');              // 这一层默认 `display:none`，点确认才上
    // ⚠️ 必须**先逼一帧**把"合上之前"的状态画出来，否则浏览器把"上层 + 改终态"合成一步、过渡不跑
    //（同一个坑本项目踩过：起点从没被画过一帧，见 debug_log 2026-09-27）
    void layer.offsetWidth;
    layer.classList.add('masked', 'risen'); // 黑幕合拢 + 搜索框升起（同时，400ms）
    setTimeout(() => { location.href = '/showcase.html'; }, 420);   // 黑透了才换纸
  });
})();

/* ---------- 页头「今天」 ---------- */
function renderToday() {
  const d = new Date();
  document.getElementById('today-txt').textContent =
    `${d.getMonth() + 1} 月 ${d.getDate()} 日 · 周${WD[d.getDay()]}`;
}

/* 配色 / 深浅控件由 `BAND.appearance` 统一接线（band-core.js），`band-shell` 负责挂载（#239）。 */
renderToday();
load();
</script>
</body>
</html>
