<!DOCTYPE html>
<html lang="zh-CN" class="nav-collapsed">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 乐团管理系统</title>
<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/app.js"></script>
</head>
<body>
<div class="login-wrap">
  <div class="cell">
    <div class="lab">山水民族管弦乐团</div>
    <h1>乐团管理系统</h1>
    <form id="login-form" class="mt-4">
      <div class="mb-3">
        <label class="lab" for="account">账号</label>
        <input id="account" class="w-100" autocomplete="username" required>
      </div>
      <div class="mb-4">
        <label class="lab" for="password">密码</label>
        <input id="password" type="password" class="w-100" autocomplete="current-password" required>
      </div>
      <button class="go w-100" type="submit">登 录</button>
    </form>
  </div>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const account = document.getElementById('account').value.trim();
  const password = document.getElementById('password').value;
  const envelope = await BAND.api('/api/auth/login', { method: 'POST', body: { account, password } });
  if (envelope.code !== 0) {
    BAND.toast(envelope.message || '登录失败');
    return;
  }
  BAND.saveToken(envelope.data.token);
  location.href = '/events.html';
});
</script>
</body>
</html>
