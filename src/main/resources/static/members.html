<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名册 · 乐团管理系统</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#13211D">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/pwa-252/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/pwa-252/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="山水乐团">

<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/band-alive.js"></script>
<script src="/band-core.js"></script>
<script src="/band-media.js"></script>
<script src="/band-notify.js"></script>
<script src="/band-profile.js"></script>
<script src="/band-shell.js"></script>
<script src="/band-welcome.js"></script>
</head>
<body>
<div id="navbar"></div>

<div class="mb-filters">
  <span class="mb-sel" id="sec-wrap">
    <select id="section" aria-label="按声部筛选"></select>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
  </span>
  <span class="mb-sel" id="status-wrap">
    <select id="status" aria-label="按状态筛选">
      <option value="">全部状态</option>
      <option value="ACTIVE">在团</option>
      <option value="PAUSED">休团</option>
      <option value="LEFT">退团</option>
      <option value="GRADUATED">毕业</option>
    </select>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
  </span>
  <button class="mb-reset" id="mb-reset" type="button">清空筛选</button>
  <span class="mb-fine">名册信息由管理员维护</span>
</div>

<div id="mb-body"></div>

<div class="mb-empty" id="mb-empty">
  <h3>没有符合条件的人</h3>
  <p>换个声部或状态看看；名册不支持搜索。</p>
  <button class="go go-ghost go-sm" id="mb-empty-reset" type="button">清空筛选</button>
</div>

<script>
'use strict';

const el = (id) => document.getElementById(id);

let me = null;
let sections = [];
let counts = { roster: 0, past: 0 };
let headSub = null;

/**
 * 一行一人的人物卡：姓名可点、整张卡可点（docs/14 §14.6.4：**姓名与头像都可点**）。
 * 账号 / 手机号是名册既有信息，卡片化后不能丢（手机号为空显示「—」）。
 */
function personCard(m) {
  const a = document.createElement('a');
  a.className = 'mb-person' + (m.role === 'HONORARY' ? ' old' : '');
  a.href = '/member-detail.html?id=' + encodeURIComponent(m.id);
  a.setAttribute('aria-label', '查看 ' + m.name + ' 的名片');

  const av = document.createElement('span');
  av.className = 'mb-av';
  av.setAttribute('aria-hidden', 'true');
  BAND.paintAvatar(av, m);

  const idWrap = document.createElement('span');
  idWrap.className = 'mb-id';
  const name = document.createElement('span');
  name.className = 'mb-name';
  name.textContent = m.name;
  const line = document.createElement('span');
  line.className = 'mb-line';
  line.textContent = [m.sectionName, m.instrument, BAND.roleLabel(m.role)].filter(Boolean).join(' · ');
  const contact = document.createElement('span');
  contact.className = 'mb-contact';
  contact.textContent = [(m.account ? '@' + m.account : '—'), (m.phone || '—')].join(' · ');
  idWrap.append(name, line, contact);

  const right = document.createElement('span');
  right.className = 'mb-right';
  if (me && String(m.id) === String(me.id)) {
    const you = document.createElement('span');
    you.className = 'mb-you';
    you.textContent = '你';
    right.appendChild(you);
  }
  const st = document.createElement('span');
  st.className = 'mb-st' + (m.status === 'ACTIVE' ? ' ok' : '');
  st.textContent = BAND.statusLabel(m.status);
  const chev = document.createElement('span');
  chev.className = 'mb-chev';
  chev.setAttribute('aria-hidden', 'true');
  chev.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 5l7 7-7 7"/></svg>';
  right.append(st, chev);

  a.append(av, idWrap, right);
  return a;
}

function sectionBlock(title, list, isOld) {
  const wrap = document.createElement('section');
  wrap.className = 'mb-sec';

  const h = document.createElement('div');
  h.className = 'mb-sec-h';
  const n = document.createElement('span');
  n.className = 'mb-sec-n';
  n.textContent = title;
  const c = document.createElement('span');
  c.className = 'mb-sec-c';
  c.textContent = list.length + ' 人';
  h.append(n, c);
  if (isOld) {
    const note = document.createElement('span');
    note.className = 'mb-sec-note';
    note.textContent = '已毕业 / 离开，名录留档';
    h.appendChild(note);
  }
  wrap.appendChild(h);

  if (isOld) {
    const line = document.createElement('p');
    line.className = 'mb-note';
    line.textContent = '他们不再计入在册人数；点开仍能看到名片与参演场次。';
    wrap.appendChild(line);
  }

  const grid = document.createElement('div');
  grid.className = 'mb-grid';
  for (const m of list) grid.appendChild(personCard(m));
  wrap.appendChild(grid);
  return wrap;
}

function render(list, filtered) {
  const body = el('mb-body');
  body.innerHTML = '';

  // 按声部顺序分节；荣誉团员**另起一节**（`docs/03` §3.4：与「历届成员」概念对齐）
  const groups = new Map();
  for (const s of sections) groups.set(s.name, []);
  const old = [];
  for (const m of list) {
    if (m.role === 'HONORARY') { old.push(m); continue; }
    const key = m.sectionName || '未分声部';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(m);
  }
  for (const [name, arr] of groups) {
    if (arr.length) body.appendChild(sectionBlock(name, arr, false));
  }
  if (old.length) body.appendChild(sectionBlock('历届成员', old, true));

  el('mb-empty').classList.toggle('show', list.length === 0);

  if (headSub) {
    headSub.textContent = (filtered ? '筛出 ' + list.length + ' 人 · ' : '')
      + '在册 ' + counts.roster + ' 人 · 历届 ' + counts.past + ' 人';
  }
  el('sec-wrap').classList.toggle('on', !!el('section').value);
  el('status-wrap').classList.toggle('on', !!el('status').value);
  el('mb-reset').classList.toggle('show', filtered);
}

async function load() {
  const sectionId = el('section').value;
  const status = el('status').value;
  const params = new URLSearchParams({ size: '100' });
  if (sectionId) params.set('sectionId', sectionId);
  if (status) params.set('status', status);
  const d = await BAND.must('/api/members?' + params);
  const list = d.list || [];
  // 无筛选时这份列表就是全量 ⇒ 顺手数「在册 / 历届」（筛选后只看筛出数，不重算总数）
  if (!sectionId && !status) {
    counts.roster = list.filter((m) => m.role !== 'HONORARY').length;
    counts.past = list.filter((m) => m.role === 'HONORARY').length;
  }
  render(list, !!(sectionId || status));
  BAND.navigation.restoreScroll();
}

function resetFilters() {
  el('section').value = '';
  el('status').value = '';
  load();
}

async function init() {
  me = await BAND.renderNav('members.html');
  if (!me) return;

  const h1 = document.querySelector('.head-l h1');
  if (h1) {
    headSub = document.createElement('p');
    headSub.className = 'mb-sub';
    h1.after(headSub);
  }

  sections = await BAND.must('/api/sections');
  BAND.fillSelect(el('section'), sections.map((s) => ({ value: s.id, label: s.name })), '全部声部');
  BAND.navigation.registerList({capture:()=>({section:el('section').value,status:el('status').value}),restore:s=>{for(const k of ['section','status'])if([...el(k).options].some(o=>o.value===s[k]))el(k).value=s[k];}});

  el('section').addEventListener('change', load);
  el('status').addEventListener('change', load);
  el('mb-reset').addEventListener('click', resetFilters);
  el('mb-empty-reset').addEventListener('click', resetFilters);

  await load();
}

init();
</script>
</body>
</html>
