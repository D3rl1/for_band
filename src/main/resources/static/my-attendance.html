<!-- ══ 外观控件行（docs/14 §14.6.2b；键沿用 band.palette / band.theme）══ -->
<div class="ev-appbar">
  <span class="ev-today">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
    <b id="today-txt">今天</b>

  <button class="ticon" id="theme-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="配色方案" title="配色">

  </button>
  <button class="ticon" id="night-btn" type="button" aria-pressed="false" aria-label="切换到深色" title="深浅色">
    <svg id="night-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.4 6.4 0 0 0 10.5 10.5Z"/></svg>
  </button>

      <button class="seedswatch on" type="button" data-p="jade"   title="墨·青" aria-pressed="true"></button>
      <button class="seedswatch"    type="button" data-p="teal"   title="墨·松" aria-pressed="false"></button>
      <button class="seedswatch"    type="button" data-p="violet" title="墨·紫" aria-pressed="false"></button>
      <button class="seedswatch"    type="button" data-p="olive"  title="墨·缃" aria-pressed="false"></button>
      <button class="seedswatch"    type="button" data-p="clay"   title="墨·赭" aria-pressed="false"></button>
      <button class="seedswatch"    type="button" data-p="ink"    title="纯墨"  aria-pressed="false"></button>

<!-- 我的出勤（docs/14 §14.6.4 / docs/05 §5.4，交接单 #204）：**只读、只看自己**，一页三段。
     ①成对统计卡：出勤率与请假次数**必须在同一张卡**（docs/05 §5.4 硬规则）；
     ②请假记录：原「我的请假」页并进来的——申请单（含未生效的）与请假次数不是同一个数，
       所以筛选行前面有一枚「请假申请」小标，把两本账在字面上切开；
     ③逐场明细：只读 `mine`，按「月」分组，「加载更早的」走既有 page / size。
     ⚠️ 本页**不提供签到**——签到仍在活动详情页（event-detail.html）。 -->
<div class="at-glance" id="glance"></div>
<div class="at-noattend" id="noattend"></div>
<p class="at-hintline" id="glance-note"></p>

<!-- ── 段二 · 请假记录 ── -->
<div class="ev-lhead">
  <span class="sec"><h2>请假记录</h2><span class="sub" id="list-count"></span></span>
</div>
<div class="ev-filters" id="filter" role="group" aria-label="按状态筛选"></div>
<div id="groups"></div>
<div class="ev-empty" id="empty">
  <span class="ic">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v3M16 3v3M9 14h6"/></svg>
  </span>
  <b>还没有请假记录</b>
  <span>在活动的详情页里，就能就某一场活动请假</span>
</div>

<!-- ── 段三 · 逐场明细 ── -->
<div class="ev-lhead at-sec-gap">
  <span class="sec"><h2>逐场明细</h2><span class="sub" id="sess-count"></span></span>
</div>
<div class="ev-filters" id="sessfilter" role="group" aria-label="按我的状态筛选"></div>
<div id="sessions"></div>
<div class="ev-empty" id="sess-empty">
  <span class="ic">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
  </span>
  <b>还没有考勤记录</b>
  <span>入团之后有活动，这里就会开始记</span>
</div>

<script>
'use strict';

const WD = ['日', '一', '二', '三', '四', '五', '六'];
/* 不计考勤的身份（docs/05 §5.4）：两张统计卡**整个不渲染**，换成说明行——不是把数字改成 0。
   ⚠️ 与 band-profile.js 的 `noAttend` 同一口径（CONDUCTOR + HONORARY）。 */
const NO_ATTEND_ROLES = ['CONDUCTOR', 'HONORARY'];
/* 不能提交 / 撤回请假（PermissionService.checkAttendeeAction）：荣誉团员 + 指挥。 */
const CANCEL_BLOCKED_ROLES = ['CONDUCTOR', 'HONORARY'];
const MS = {
  PRESENT: { cls: 'p', text: '出勤' },
  // 遗憾离场（DECISIONS D33）：到场但提前离开，按出勤算；中性墨色，**不复用缺勤的红**
  PARTIAL: { cls: 'pt', text: '遗憾离场' },
  LEAVE: { cls: 'l', text: '请假' },
  ABSENT: { cls: 'a', text: '缺勤' },
};
/* 后端 `requiredRole` 存的是 Role 枚举名（LeaveService.create:93-95），不是中文。 */
const ROLE_LABEL = { SECTION_LEADER: '声部长', LEADER: '团长' };
const FILTERS = [
  ['all', '全部'],
  ['PENDING', '待审批'],
  ['APPROVED', '已通过'],
  ['REJECTED', '已驳回'],
  ['CANCELED', '已撤回'],
  ['overdue', '逾期未批'],
];
const SESS_FILTERS = [['all', '全部'], ['PRESENT', '出勤'], ['PARTIAL', '遗憾离场'], ['LEAVE', '请假'], ['ABSENT', '缺勤']];

let me = null;
let noAttend = false;
let reqs = [];
let reqTotal = 0;
let filter = 'all';
let sessions = [];
let sessTotal = 0;
let sessFilter = 'all';
let loadingMore = false;

const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

/* ---------- 日期 ---------- */
function dparts(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  if (!m) return { d: iso || '—', w: '' };
  const dt = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return { d: Number(m[2]) + '/' + Number(m[3]), w: '周' + WD[dt.getDay()] };
}
function monthKey(iso) {
  const p = String(iso || '').split('-');
  return p[0] + '-' + p[1];
}
/* 「活动是否已经开始」——撤回的门槛是**活动未开始**（LeaveService.ensureEventNotStarted），
   ⚠️ 不是"未逾期"：逾期要等活动**结束**才成立，中间"已开始未结束"那段服务端也会拒。
   `eventStartTime` 可能是 `19:00` 也可能是 `19:00:30` ⇒ 只取前 5 位；缺时间就**保守视为已开始**。 */
function startedOf(r) {
  if (!r.eventDate) return true;
  const t = String(r.eventStartTime || '').slice(0, 5);
  if (!t) return true;
  const at = new Date(r.eventDate + 'T' + t);
  return isNaN(at) ? true : at.getTime() <= Date.now();
}
function canCancel(r) {
  return r.status === 'PENDING' && !r.overdue && !startedOf(r)
    && me && !CANCEL_BLOCKED_ROLES.includes(me.role);
}

/* ---------- 状态与签章 ---------- */
function statusOf(r) {
  if (r.overdue) return { cls: 'no', text: '逾期未批 · 已按缺勤计' };
  return ({
    PENDING: { cls: 'pending', text: '待审批' },
    APPROVED: { cls: 'ok', text: '已通过' },
    REJECTED: { cls: 'no', text: '已驳回' },
    CANCELED: { cls: 'done', text: '已撤回' },
  })[r.status] || { cls: 'pending', text: r.status || '—' };
}
/* 双签章：一条申请有几个审批槽就画几枚（排练 2 枚 / 声部课 1 枚，槽位数由活动类型定死）。
   ⚠️ 印跟状态变色是「印本来就该是朱砂」的**明确例外**（docs/14，用户 2026-10-15 拍板）；
   **姓名一律墨色**（红笔写活人名犯忌），红只留给「✕ 已驳回」几个字。 */
function sealsNode(r, mineIdx) {
  const box = el('div', 'at-seals');
  (r.approvals || []).forEach((a, i) => {
    const cls = a.decision === 'APPROVED' ? ' ok' : a.decision === 'REJECTED' ? ' no' : '';
    const mine = (mineIdx != null && i === mineIdx) ? ' mine' : '';
    const seal = el('div', 'at-seal' + cls + mine);
    seal.appendChild(el('span', 'r', ROLE_LABEL[a.requiredRole] || a.requiredRole || '审批'));
    const v = el('span', 'v');
    if (a.decision === 'APPROVED') {
      v.appendChild(document.createTextNode('✓ 已批'));
      v.appendChild(el('span', 'who', a.approverName || '—'));
    } else if (a.decision === 'REJECTED') {
      v.appendChild(document.createTextNode('✕ 已驳回'));
      v.appendChild(el('span', 'who', a.approverName || '—'));
    } else {
      v.appendChild(document.createTextNode('未批'));
    }
    if (a.note) v.appendChild(el('span', 'note', a.note));
    seal.appendChild(v);
    box.appendChild(seal);
  });
  return box;
}

/* ---------- 段二 · 请假记录 ---------- */
function matchFilter(r) {
  if (filter === 'all') return true;
  if (filter === 'overdue') return !!r.overdue;
  if (filter === 'PENDING') return r.status === 'PENDING' && !r.overdue;
  return r.status === filter;
}
function countOf(k) {
  if (k === 'all') return reqs.length;
  return reqs.filter((r) => (k === 'overdue' ? !!r.overdue
    : (k === 'PENDING' ? (r.status === 'PENDING' && !r.overdue) : r.status === k))).length;
}
function bucketOf(r) {
  return r.status === 'PENDING' ? 'todo' : 'done';
}
function renderFilters() {
  const host = $('filter');
  host.innerHTML = '';
  // 「请假申请」小标是故意的：这一段数的是申请条数（含还没生效的），
  // 与段一的「请假次数」（已写进考勤的场次）不是同一个数。
  host.appendChild(el('span', 'at-flab', '请假申请'));
  for (const [k, label] of FILTERS) {
    const b = el('button', 'fchip', `${label} ${countOf(k)}`);
    b.type = 'button';
    b.dataset.f = k;
    b.setAttribute('aria-pressed', String(filter === k));
    b.addEventListener('click', () => {
      if (filter === k) return;
      filter = k;
      renderFilters();
      renderReqs();
    });
    host.appendChild(b);
  }
}
function reqRow(r) {
  const dp = dparts(r.eventDate);
  const st = statusOf(r);
  const row = el('article', 'at-lr');
  row.dataset.id = r.id;
  row.dataset.st = r.overdue ? 'overdue' : r.status;

  const db = el('div', 'at-db');
  db.appendChild(el('span', 'd', dp.d));
  db.appendChild(el('span', 'w', dp.w));
  row.appendChild(db);

  const body = el('div', 'at-body');
  const top = el('div', 'at-top');
  const left = el('div');
  const title = el('div', 'at-t');
  title.appendChild(document.createTextNode(r.eventTitle || '（未命名活动）'));
  if (r.eventKind) title.appendChild(el('span', 'at-kind', BAND.kindLabel(r.eventKind)));
  left.appendChild(title);
  left.appendChild(el('div', 'at-meta', '理由：' + (r.reason || '—')));
  // 已通过的行标一句"已计入考勤"：把申请单与考勤台账这两本账显式挂钩。
  if (r.status === 'APPROVED') {
    left.appendChild(el('div', 'at-meta linked', '已计入考勤（见下面「逐场明细」）'));
  }
  top.appendChild(left);

  const ops = el('div', 'at-ops');
  ops.appendChild(el('span', 'at-st ' + st.cls, st.text));
  if (canCancel(r)) {
    const btn = el('button', 'go go-ghost go-sm', '撤回');
    btn.type = 'button';
    btn.addEventListener('click', () => cancelReq(r, btn));
    ops.appendChild(btn);
  }
  top.appendChild(ops);

  body.appendChild(top);
  body.appendChild(sealsNode(r, null));
  row.appendChild(body);
  return row;
}
async function cancelReq(r, btn) {
  if (!await BAND.confirm({ title: '确定撤回这条申请？' })) return;
  btn.disabled = true;
  try {
    await BAND.must(`/api/leave-requests/${r.id}/cancel`, { method: 'POST' });
    BAND.toast('已撤回', 'success');
    await loadRequests();
  } catch (e) {
    btn.disabled = false;   // 失败时把钮放回去（toast 已由 must 弹出）
  }
}
function renderReqs() {
  const list = reqs.filter(matchFilter);
  // 计数基于**已加载**的那一批：超过一页时显式写"已显示 N / 共 T 条"，别把局部数当全量。
  $('list-count').textContent = reqTotal > reqs.length
    ? `已显示 ${reqs.length} / 共 ${reqTotal} 条`
    : (filter === 'all' ? `共 ${reqs.length} 条` : `${list.length} / ${reqs.length} 条`);
  $('empty').classList.toggle('show', list.length === 0);

  const host = $('groups');
  host.innerHTML = '';
  const groups = [
    { k: 'todo', label: '待处理', hint: '还在等审批' },
    { k: 'done', label: '已结束', hint: '' },
  ];
  for (const g of groups) {
    const rows = list.filter((r) => bucketOf(r) === g.k);
    if (!rows.length) continue;
    const sec = el('section', 'ev-group');
    const gh = el('div', 'g-h');
    gh.appendChild(el('span', 't', g.label));
    gh.appendChild(el('span', 'ln'));
    gh.appendChild(el('span', 'c', `${rows.length} 条${g.hint ? ' · ' + g.hint : ''}`));
    sec.appendChild(gh);
    const box = el('div', 'ev-rows');
    rows.forEach((r) => box.appendChild(reqRow(r)));
    sec.appendChild(box);
    host.appendChild(sec);
  }
}
async function loadRequests() {
  const d = await BAND.must('/api/leave-requests?scope=mine&size=100');
  reqs = d.list || [];
  reqTotal = d.total || 0;
  renderFilters();
  renderReqs();
}

/* ---------- 段一 · 成对统计卡 ---------- */
function glanceCard(label, k) {
  const card = el('div', 'at-gcard');
  card.appendChild(el('div', 'lab', label));
  const rate = el('div', 'at-rate');
  const b = el('b', null, BAND.ratePct(k.rate, k.expected));
  b.setAttribute('data-count', '');
  rate.appendChild(b);
  rate.appendChild(el('span', 'u', '出勤率'));
  card.appendChild(rate);
  const leave = el('div', 'at-leave', '请假 ');
  const lb = el('b', null, String(k.leave));
  lb.setAttribute('data-count', '');
  leave.appendChild(lb);
  leave.appendChild(document.createTextNode(' 次'));
  card.appendChild(leave);
  card.appendChild(el('div', 'at-split', `应到 ${k.expected} · 出勤 ${k.present} · 缺勤 ${k.absent}`));
  return card;
}
function renderGlance(sum) {
  const host = $('glance');
  host.innerHTML = '';
  if (noAttend) {
    // 两张卡**整个不渲染**（不是把数字改成 0）；硬规则禁的是"只出现一个"，两个都不出现不算犯规。
    host.hidden = true;
    $('noattend').classList.add('show');
    return;
  }
  host.hidden = false;
  $('noattend').classList.remove('show');
  host.append(glanceCard('排练出勤', sum.rehearsal), glanceCard('声部课出勤', sum.sectionClass));
}
function renderGlanceNote() {
  $('glance-note').textContent = noAttend
    ? '（下面两段仍是你自己的历史记录；不计考勤的身份不能提交、也不能撤回请假。）'
    : '请假次数＝已批准生效的场次；未批 / 已驳回 / 已撤回的不计入 —— 那些是「请假申请」，见下。';
}

/* ---------- 段三 · 逐场明细 ----------
   ⚠️ `sessions` 接口不过滤日期：未来**未开始**的应到场次也一律 `ABSENT`。
   真问题（后端 DTO 没有开始时间，只能按日期判）：`date > 今天` 且 `mine === 'ABSENT'`
   ⇒ 显示「未开始」、不挂朱砂、**不计入缺勤筛选**。今天已开始但未签的仍显示缺勤。 */
function isSoon(s) {
  return !noAttend && s.mine === 'ABSENT' && s.date > BAND.localDayKey();
}
function mineOf(s) {
  if (noAttend && s.mine === 'ABSENT') return null;   // 已离团 / 指挥：历史上没签的回落成「—」
  if (isSoon(s)) return null;
  return s.mine;
}
function sessMatch(s) {
  return sessFilter === 'all' || mineOf(s) === sessFilter;
}
function sessCount(k) {
  if (k === 'all') return sessions.length;
  return sessions.filter((s) => mineOf(s) === k).length;
}
function renderSessFilters() {
  const host = $('sessfilter');
  host.innerHTML = '';
  for (const [k, label] of SESS_FILTERS) {
    const b = el('button', 'fchip', `${label} ${sessCount(k)}`);
    b.type = 'button';
    b.dataset.f = k;
    b.setAttribute('aria-pressed', String(sessFilter === k));
    b.addEventListener('click', () => {
      if (sessFilter === k) return;
      sessFilter = k;
      renderSessFilters();
      renderSessions();
    });
    host.appendChild(b);
  }
}
function sessRow(s) {
  const row = el('div', 'at-srow');
  const dp = dparts(s.date);
  row.appendChild(el('span', 'sd', dp.d));
  const se = el('span', 'se');
  const a = el('a', null, s.title || '（未命名活动）');
  a.href = '/event-detail.html?id=' + s.eventId;
  se.appendChild(a);
  if (s.kind) se.appendChild(el('span', 'k', BAND.kindLabel(s.kind)));
  row.appendChild(se);
  const soon = isSoon(s);
  const m = soon ? { cls: 'soon', text: '未开始' } : (MS[mineOf(s)] || { cls: 'none', text: '—' });
  row.appendChild(el('span', 'at-ms ' + m.cls, m.text));
  return row;
}
function renderSessions() {
  const rows = sessions.filter(sessMatch);
  $('sess-count').textContent = `已显示最近 ${sessions.length} 场 · 共 ${sessTotal} 场`;
  $('sess-empty').classList.toggle('show', rows.length === 0);

  const host = $('sessions');
  host.innerHTML = '';
  const counts = {};
  for (const s of rows) counts[monthKey(s.date)] = (counts[monthKey(s.date)] || 0) + 1;
  let cur = null;
  let list = null;
  for (const s of rows) {
    const mk = monthKey(s.date);
    if (mk !== cur) {
      cur = mk;
      const [y, m] = mk.split('-');
      const sec = el('section', 'ev-group');
      const gh = el('div', 'g-h');
      gh.appendChild(el('span', 't', `${y} 年 ${Number(m)} 月`));
      gh.appendChild(el('span', 'ln'));
      gh.appendChild(el('span', 'c', `${counts[mk]} 场`));
      sec.appendChild(gh);
      list = el('div', 'at-sess');
      sec.appendChild(list);
      host.appendChild(sec);
    }
    list.appendChild(sessRow(s));
  }

  if (rows.length && sessions.length < sessTotal) {
    const bar = el('div', 'at-more');
    const b = el('button', 'go go-ghost go-sm', '加载更早的');
    b.type = 'button';
    b.id = 'sess-more';
    b.addEventListener('click', loadMore);
    bar.appendChild(b);
    host.appendChild(bar);
  }
}
async function loadMore() {
  if (loadingMore) return;
  loadingMore = true;
  const btn = $('sess-more');
  if (btn) btn.disabled = true;
  try {
    const page = Math.floor(sessions.length / 50) + 1;
    const d = await BAND.must(`/api/attendance/sessions?page=${page}&size=50`);
    const got = d.list || [];
    sessTotal = d.total || sessTotal;
    sessions = sessions.concat(got);
    renderSessFilters();
    renderSessions();
    if (got.length) BAND.toast(`已载入更早的 ${got.length} 场`, 'success');
  } catch (e) {
    if (btn) btn.disabled = false;   // toast 已由 must 弹出
  } finally {
    loadingMore = false;
  }
}

/* ---------- 载入 ---------- */
async function load() {
  me = await BAND.renderNav('my-attendance.html');
  if (!me) return;
  noAttend = NO_ATTEND_ROLES.includes(me.role);
  $('noattend').textContent = me.role === 'HONORARY'
    ? '荣誉团员不计考勤（已离团，不进应到名单）—— 下面仍是你自己的历史记录。'
    : '指挥不计考勤（不在应到名单）—— 下面仍是你自己的历史记录。';
  renderGlanceNote();

  const [sum, d, rq] = await Promise.all([
    BAND.must(`/api/members/${me.id}/attendance-summary`),
    BAND.must('/api/attendance/sessions?page=1&size=50'),
    BAND.must('/api/leave-requests?scope=mine&size=100'),
  ]);

  renderGlance(sum);

  reqs = rq.list || [];
  reqTotal = rq.total || 0;
  renderFilters();
  renderReqs();

  sessions = d.list || [];
  sessTotal = d.total || sessions.length;
  renderSessFilters();
  renderSessions();

  // ⚠️ 必须在数字与行都建好**之后**才播（早调会快照到空状态；"播过"的标志一置位就不再播）。
  BAND.alive($('glance'), $('groups'), $('sessions'));
}

/* 配色 / 深浅控件由 `BAND.appearance` 统一接线（band-core.js），`band-shell` 负责挂载（#239）。 */
function renderToday() {
  const d = new Date();
  $('today-txt').textContent = `${d.getMonth() + 1} 月 ${d.getDate()} 日 · 周${WD[d.getDay()]}`;
}

renderToday();
load();
</script>
