<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>录音 · 乐团管理系统</title>
<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/band-alive.js"></script>
<script src="/band-core.js"></script>
<script src="/band-media.js"></script>
<script src="/band-notify.js"></script>
<script src="/band-profile.js"></script>
<script src="/band-shell.js"></script>
<script src="/band-welcome.js"></script>
</head>
<body>
<div id="navbar"></div>

<!-- 上传（荣誉团员看不到这一块：他们只读，服务端也会 403） -->
<div class="cell mb-4" id="upload-box" hidden>
  <div class="lab">传一段练习录音</div>
  <p class="chip" id="rec-hint">手机上可以直接录（3 分钟以内），也可以选机器里已有的录音文件。传上来之后声部长可以点评。</p>
  <!-- ⭐ **两个入口是分开的、各自带文字的控件**（`docs/08` §8.4）：**这里曾经是一个裸的
       `<input type="file" accept="audio/*">` 挤在这一行里** —— 无标签、没人注意得到，
       点下去还会被系统送去**录音机 App**（`audio/*` 是通配，安卓按"谁能产出音频"匹配，录音机正好声明了它；
       ⚠️ **不是 `capture` 的锅**，本仓从来没写过，**加了才会强制录音**）。
       ⚠️ `accept` 必须列**显式扩展名 + 具体 MIME**，不得用 `audio/*`、不得加 `capture`。
       ⚠️ 那个 input 是**视觉隐藏**的（`visually-hidden`，不是 `display:none`），由上面那个带 `for` 的
       label 触发 —— 这样键盘 / 读屏也点得到，且页面上不再有"没人知道的裸控件"。
       ⚠️ **挑完就直接上传，没有第二个「上传」按钮**：多一跳的代价是"选了没传、却以为传了"。 -->
  <div class="row g-2">
    <div class="col-12 col-md-3"><input id="u-title" class="w-100" maxlength="64" placeholder="标题（如：快板那一段）"></div>
    <div class="col-12 col-md-3"><select id="u-piece" class="w-100"><option value="">不关联曲目</option></select></div>
    <div class="col-12 col-md-3"><button id="u-record" class="go go-sm w-100" type="button">页面内录音</button></div>
    <div class="col-12 col-md-3">
      <label class="go go-ghost go-sm w-100 text-center" for="u-file">选择本机文件</label>
      <input id="u-file" type="file" class="visually-hidden"
             accept=".m4a,.mp3,.wav,audio/mp4,audio/mpeg,audio/x-m4a,audio/wav">
    </div>
  </div>

  <!-- 节拍器（`docs/08` §8.4「页面内录音：节拍器与音质约束」）：⭐ **整块功能存在的唯一理由**——
       团员原先"手机录音机 + 另一个节拍器 App"，而**录音机一启动就抢走音频焦点、把节拍器静音**；
       网页里 `MediaRecorder` 抓的是麦克风流，**不会静音页面自己的音频输出**。 -->
  <div class="metro" id="metro">
    <div class="lab">节拍器 <span>（对着它录：录音全程它都响）</span></div>
    <div class="metro-row">
      <label class="metro-f" for="m-bpm">速度
        <input id="m-bpm" type="number" min="30" max="240" step="1" inputmode="numeric">
        <span>BPM</span>
      </label>
      <label class="metro-f" for="m-beats">拍号
        <select id="m-beats">
          <option value="2">2/4</option>
          <option value="3">3/4</option>
          <option value="4" selected>4/4</option>
          <option value="6">6/8</option>
        </select>
      </label>
      <label class="metro-f metro-ck" for="m-accent">
        <input id="m-accent" type="checkbox" checked> 首拍重音
      </label>
      <button id="m-toggle" class="go go-sm" type="button">开始</button>
    </div>
    <!-- 一拍一个点，当前拍点亮、**重拍更明显**（⚠️ 别做成一整条进度条） -->
    <div class="metro-dots" id="m-dots" aria-hidden="true"></div>
    <p class="chip" id="m-hint">⚠️ 外放会把节拍声一起录进去，<b>戴耳机（建议有线）才两头兼顾</b>；录音中<b>请勿切走应用</b>。</p>
  </div>
</div>

<div class="d-flex justify-content-between align-items-center mb-2">
  <h2 class="mb-0">录音</h2>
  <select id="q-scope" class="w-auto">
    <option value="mine">只看我的</option>
    <option value="">我能听到的全部</option>
  </select>
</div>
<div id="list"></div>
<p id="empty" class="py-4" hidden>还没有录音——手机对着吹一段传上来，让声部长听听</p>

<script>
'use strict';

let me = null;
let recorder = null;
let chunks = [];
// ⭐ **同一时刻最多一个在播**（`docs/08` §8.4，`#112`）：用户原话「听录音的时候可以同时按多个录音听，
//    这个不好，一次应该只能听一个」。
// ⚠️ **持一个"当前正在播的那个"引用、切换时显式关掉旧的** —— **不要靠 `pause` 事件去推状态**：
//    快速连点会打断进行中的事件，`pause` 不保证按时到达，状态就卡住了（`docs/14` §14.6.6「过渡必须可取消」同族）。
let playingAudio = null;
// ⚠️ `load()` 会被反复调用（切筛选、上传完、删完）⇒ **事件绑定只做一次**。
//    （原来 `setupRecorder()` 每次 load 都绑一遍，点「开始录音」会**叠着起两个 MediaRecorder**——
//     本轮顺手修掉。）
let wired = false;
const MAX_SECONDS = 180;   // 时长上限 3 分钟（T5 暂定）：**只能在前端拦**，服务端不解析音频

async function load() {
  me = await BAND.renderNav('recordings.html');
  if (!me) return;
  // 荣誉团员只读：他们不能上传（docs/02 防腐条款），服务端也会 403——这里只是不显示无用的按钮
  document.getElementById('upload-box').hidden = me.role === 'HONORARY';
  if (me.role !== 'HONORARY') {
    const pieces = await BAND.must('/api/pieces?size=100');
    BAND.fillSelect(document.getElementById('u-piece'),
      pieces.list.map((p) => ({ value: p.id, label: p.title })), '不关联曲目');
    if (!wired) {          // ⚠️ 只绑一次（见 `wired` 的说明）
      wired = true;
      setupRecorder();
      metroInit();
    }
  }

  const scope = document.getElementById('q-scope').value;
  const query = scope === 'mine' ? `?memberId=${me.id}&size=50` : '?size=50';
  const d = await BAND.must('/api/recordings' + query);
  const host = document.getElementById('list');
  if (playingAudio) { playingAudio.pause(); playingAudio = null; }   // 旧节点马上要被丢掉，先停声
  host.innerHTML = '';
  document.getElementById('empty').hidden = d.list.length > 0;
  for (const r of d.list) host.appendChild(card(r));
}

function card(r) {
  const el = document.createElement('div');
  el.className = 'cell mb-3';
  const head = document.createElement('div');
  head.className = 'd-flex justify-content-between align-items-center';
  const who = document.createElement('b');
  who.textContent = r.title || '（未命名）';
  const meta = document.createElement('span');
  meta.className = 'chip mb-0';
  meta.textContent = [r.memberName, r.sectionName, r.pieceTitle,
    r.durationSec ? Math.round(r.durationSec) + ' 秒' : null,
    BAND.sizeText(r.sizeBytes), BAND.stamp(r.uploadedAt)]
    .filter(Boolean).join(' · ');
  head.append(who, meta);
  el.appendChild(head);

  // 播放：**必须走 blob**（裸 <audio src="/api/files/id"> 不带 Authorization 头，永远 401）
  const audio = document.createElement('audio');
  audio.controls = true;
  audio.className = 'w-100 mt-2';
  // ⭐ 互斥（`#112`）：这条一开始播，就把"上一个在播的"**显式**停掉并归零（不靠 `pause` 事件推状态）。
  audio.addEventListener('play', () => {
    if (playingAudio && playingAudio !== audio) {
      playingAudio.pause();
      playingAudio.currentTime = 0;
    }
    playingAudio = audio;
  });
  el.appendChild(audio);
  BAND.fileBlobUrl(r.fileId).then((url) => { audio.src = url; }).catch(() => {});

  const row = document.createElement('div');
  row.className = 'd-flex gap-2 mt-2';
  const toggle = document.createElement('button');
  toggle.className = 'go go-ghost go-sm';
  toggle.type = 'button';
  toggle.textContent = `点评（${r.commentCount}）`;
  const del = document.createElement('button');
  del.className = 'go go-ghost go-sm';
  del.type = 'button';
  del.textContent = '删除';
  del.hidden = true;   // 由服务端的删除权限决定（管理员 / 本人 / 本声部长）——先试一次再说
  row.append(toggle, del);
  el.appendChild(row);

  const box = document.createElement('div');
  box.hidden = true;
  el.appendChild(box);

  toggle.addEventListener('click', async () => {
    box.hidden = !box.hidden;
    if (!box.hidden) await drawComments(r, box);
  });
  del.addEventListener('click', async () => {
    if (!await BAND.confirm({ title: '删掉这段录音？', body: r.title || '' })) return;
    await BAND.must(`/api/recordings/${r.id}`, { method: 'DELETE' });
    BAND.toast('已删除', 'success');
    load();
  });
  // 删除按钮只在"我可能就是有权限的人"时显示；真权限由服务端判（403 会 toast）。
  // ⚠️ **团长 / 指挥不在名单里**：他们能"听全部"但**不能删任何人的录音**（docs/02 §2.3 矩阵 +
  //    docs/08 §8.3，2026-09-23 由 ✅ 收窄为 ❌）。`r.memberId === me.id` 那一支要留着——
  //    团长 / 指挥删**自己上传的**那条仍然合法。
  del.hidden = !(r.memberId === me.id || ['ADMIN', 'SECTION_LEADER'].includes(me.role));
  return el;
}

async function drawComments(r, box) {
  const d = await BAND.must(`/api/recordings/${r.id}`);
  box.innerHTML = '';
  for (const c of d.comments) {
    const p = document.createElement('p');
    p.className = 'mb-1';
    const who = document.createElement('b');
    who.textContent = c.authorName + '：';
    const text = document.createElement('span');
    text.textContent = c.content;
    p.append(who, text);
    box.appendChild(p);
  }
  if (!d.comments.length) {
    const p = document.createElement('p');
    p.className = 'chip mb-1';
    p.textContent = '还没有点评';
    box.appendChild(p);
  }
  const input = document.createElement('input');
  input.className = 'w-100 mt-1';
  input.placeholder = '说点什么（能听到这段录音的人都能说）';
  const send = document.createElement('button');
  send.className = 'go go-sm mt-1';
  send.type = 'button';
  send.textContent = '发送';
  send.addEventListener('click', async () => {
    if (!input.value.trim()) return;
    await BAND.must(`/api/recordings/${r.id}/comments`, {
      method: 'POST',
      body: { content: input.value.trim() },
    });
    input.value = '';
    drawComments(r, box);
  });
  box.append(input, send);
}

/**
 * 录音：**先试 audio/mp4**——规格的音频白名单是 m4a/mp3/wav，而 Chrome 的 MediaRecorder
 * 默认产出 webm（不在白名单）。不支持就直接退回"选本地文件"，并**明说一句**，不许静默失败。
 */
function setupRecorder() {
  const btn = document.getElementById('u-record');
  const hint = document.getElementById('rec-hint');
  const supported = window.MediaRecorder
    && MediaRecorder.isTypeSupported('audio/mp4');
  if (!supported) {
    btn.disabled = true;
    btn.textContent = '本浏览器不支持';
    hint.textContent = '这个浏览器不能直接录音（它录出来的格式系统不收）——请用手机录音机录好，再选本地文件上传。';
    return;
  }
  btn.addEventListener('click', async () => {
    if (recorder && recorder.state === 'recording') {
      recorder.stop();
      return;
    }
    // ⚠️ **"录音停"不等于"节拍器停"**（`docs/08` §8.4）：两者各管各的——节拍器由用户自己按才停，
    //    这样停一次录音还能接着录下一条。**不许做成"录音结束自动关节拍器"。**
    try {
      // ⚠️ **必须显式关掉浏览器的语音处理**（`docs/08` §8.4）：裸写 `{audio:true}` 会把
      //    回声消除 / 降噪 / 自动增益**全打开** —— 那三样是**为语音通话调的**：自动增益来回压电平、
      //    降噪把**乐器的弱音尾巴当噪声掐掉**、回声消除连带压平乐器。给乐器录音，这是缺陷不是保守。
      //    代价（有意的取舍）：关掉回声消除 ⇒ **外放时节拍声必然进录音** ⇒ 所以要戴耳机。
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      });
      chunks = [];
      recorder = new MediaRecorder(stream, { mimeType: 'audio/mp4' });
      const startedAt = Date.now();
      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        btn.textContent = '页面内录音';
        const seconds = Math.round((Date.now() - startedAt) / 1000);
        if (seconds > MAX_SECONDS) {
          BAND.toast(`录了 ${seconds} 秒，超过 3 分钟上限——重录一段吧`);
          return;
        }
        const blob = new Blob(chunks, { type: 'audio/mp4' });
        await sendRecording(new File([blob], `take-${Date.now()}.m4a`, { type: 'audio/mp4' }), seconds);
      };
      recorder.start();
      btn.textContent = '停止';
      setTimeout(() => {   // 到 3 分钟自动停，别录出超长的东西
        if (recorder && recorder.state === 'recording') recorder.stop();
      }, MAX_SECONDS * 1000);
    } catch (e) {
      BAND.toast('拿不到麦克风权限');
    }
  });
}

/* ⭐ 「选择本机文件」**挑完就直接上传**（`docs/08` §8.4）：不再要求点第二次按钮 ——
   多那一跳的代价是"选了没传、却以为传了"（旧版漏点那下只弹一句"先选一个音频文件"，人以为自己没选对）。
   ⚠️ 这条路**不受 3 分钟限制**（`T5`：只受 20MB 体积限制；服务端本来就解析不了音频时长）。 */
document.getElementById('u-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  await sendRecording(file, null);   // ⚠️ 第二参传 null = 不报时长 ⇒ 不触发 3 分钟那条
  e.target.value = '';               // 清掉，方便再挑同一个文件
});

async function sendRecording(file, seconds) {
  const uploaded = await BAND.uploadFile(file);
  const pieceValue = document.getElementById('u-piece').value;
  await BAND.must('/api/recordings', {
    method: 'POST',
    body: {
      fileId: uploaded.id,
      pieceId: pieceValue ? Number(pieceValue) : null,
      title: document.getElementById('u-title').value.trim() || null,
      durationSec: seconds,
    },
  });
  document.getElementById('u-title').value = '';
  BAND.toast('已上传', 'success');
  load();
}

/* ---------- 节拍器（docs/08 §8.4「页面内录音：节拍器与音质约束」） ----------
   ⭐ **整块功能存在的唯一理由**：团员原先"手机录音机 + 另一个节拍器 App"，而**录音机一启动就抢走音频焦点、
   把节拍器 App 静音** —— "跟节拍器录"在手机上根本做不成。网页里能成立是因为 `MediaRecorder` 抓的是
   麦克风流、**不会静音页面自己的音频输出** ⇒ 所以它必须在**录音进行中一直响**（这才是它的价值）。
   ⚠️ 规则三条写死：**不受 `band_sound` 约束**（显式例外）、**"录音停"不等于"节拍器停"**（各管各的）、
   **预备拍（起拍）本轮不做**。 */
const METRO_BPM_KEY = 'band_metronome_bpm';
const BPM_MIN = 30;
const BPM_MAX = 240;
const LOOKAHEAD_S = 0.1;      // 提前排 100ms 的音
const TICK_MS = 25;           // 每 25ms 看一眼

const metro = {
  on: false, bpm: 80, beats: 4, accent: true,
  beat: 0, next: 0, timer: null,
};
// 面板上那句常驻提示的原文（切后台停播时会被换成警告，重新开始要还原回来）
const METRO_HINT = document.getElementById('m-hint').textContent;
// ⚠️ 可读钩子：探针读**实际排出去的拍**（别让探针逐帧采样 —— Windows 上 rAF 会被饿死，见 debug_log）
window.__metro = { on: false, ticks: [] };

function metroClampBpm(v) {
  const n = Math.round(Number(v));
  // ⚠️ `Number(null)` 是 **0**（不是 NaN）⇒ 不显式挡掉"没存过 / 空串"，本机没记录时会被当成
  //    "0 BPM"再夹到下限 30 —— 实测默认值就是这样悄悄变成 30 的（2026-09-28 探针逮住）。
  if (!Number.isFinite(n) || n <= 0) return 80;
  return Math.min(BPM_MAX, Math.max(BPM_MIN, n));
}

function metroDots() {
  const host = document.getElementById('m-dots');
  host.innerHTML = '';
  for (let i = 0; i < metro.beats; i++) host.appendChild(document.createElement('i'));
}

/** 点亮第 `i` 个点（`-1` = 全灭）。⚠️ 只切 class，位移/大小交给 CSS（`transform` / `opacity` 白名单）。 */
function metroPaint(i) {
  const dots = document.querySelectorAll('#m-dots i');
  dots.forEach((d, k) => d.classList.toggle('on', k === i));
}

/** 视觉跟着**已排定的拍**走：`setTimeout` 的量按音频时钟算（音频时钟准，JS 定时器会漂）。 */
function metroQueueVisual(beat, when) {
  const ac = BAND._ac;
  const delay = Math.max(0, (when - (ac ? ac.currentTime : 0)) * 1000);
  setTimeout(() => { if (metro.on) metroPaint(beat); }, delay);
}

/** lookahead 调度：**不用裸 `setInterval(60000/bpm)`**（那种写法会漂、还怕标签页被节流）。 */
function metroSchedule() {
  const ac = BAND._ac;
  if (!ac || !metro.on) return;
  const spb = 60 / metro.bpm;
  while (metro.next < ac.currentTime + LOOKAHEAD_S) {
    const accent = metro.accent && metro.beat === 0;
    BAND.tick(accent, metro.next);                      // 按音频时钟排，不"到点才响"
    window.__metro.ticks.push({ t: metro.next, accent: accent });
    metroQueueVisual(metro.beat, metro.next);
    metro.beat = (metro.beat + 1) % metro.beats;
    metro.next += spb;
  }
}

function metroStart() {
  if (metro.on) return;
  metro.beat = 0;
  const t0 = BAND.tick(metro.accent, 0);                // 第一拍立刻响（顺便把唯一的 _ac 建出来）
  if (t0 === null) { BAND.toast('这台设备出不了声（拿不到音频）'); return; }
  metro.on = true;
  window.__metro.on = true;
  window.__metro.ticks.push({ t: t0, accent: !!metro.accent });
  metroPaint(0);
  metro.beat = 1 % metro.beats;
  metro.next = t0 + 60 / metro.bpm;
  metro.timer = setInterval(metroSchedule, TICK_MS);
  document.getElementById('m-toggle').textContent = '停止';
  document.getElementById('m-toggle').classList.remove('go-ghost');
  const hint = document.getElementById('m-hint');   // 上一次"切后台就停了"的警告，重新开始时还原
  hint.classList.remove('warn');
  hint.textContent = METRO_HINT;
}

function metroStop() {
  if (metro.timer) clearInterval(metro.timer);
  metro.timer = null;
  metro.on = false;
  window.__metro.on = false;
  metroPaint(-1);
  const btn = document.getElementById('m-toggle');
  btn.textContent = '开始';
  btn.classList.add('go-ghost');
}

/** ⚠️ 规格写死：切到后台时**必须明确提示"节拍器已停"，不许静默**——无声无息地哑掉比报错更坏。 */
function metroNotice(text) {
  const hint = document.getElementById('m-hint');
  hint.classList.add('warn');
  hint.textContent = text;
  BAND.toast(text);
}

function metroInit() {
  const bpmInput = document.getElementById('m-bpm');
  metro.bpm = metroClampBpm(localStorage.getItem(METRO_BPM_KEY));
  bpmInput.value = String(metro.bpm);
  metro.beats = Number(document.getElementById('m-beats').value) || 4;
  metroDots();

  bpmInput.addEventListener('change', () => {
    metro.bpm = metroClampBpm(bpmInput.value);
    bpmInput.value = String(metro.bpm);                 // 夹过的值要写回去，别让人以为 999 生效了
    try { localStorage.setItem(METRO_BPM_KEY, String(metro.bpm)); } catch (e) { /* 隐私模式 */ }
  });
  document.getElementById('m-beats').addEventListener('change', (e) => {
    metro.beats = Number(e.target.value) || 4;
    metro.beat = Math.min(metro.beat, metro.beats - 1);
    metroDots();
  });
  document.getElementById('m-accent').addEventListener('change', (e) => {
    metro.accent = e.target.checked;
  });
  document.getElementById('m-toggle').addEventListener('click', () => {
    if (metro.on) metroStop(); else metroStart();
  });

  // ⚠️ 浏览器在页面切到后台 / 锁屏时会**挂起音频**，节拍器当场哑掉 —— 这是"要听得见"最可能被破坏的地方。
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && metro.on) {
      metroStop();
      metroNotice('节拍器已停：切到后台时浏览器会挂起音频。回到这一页后请重新按「开始」。');
    }
  });
}

document.getElementById('q-scope').addEventListener('change', load);
load();
</script>
