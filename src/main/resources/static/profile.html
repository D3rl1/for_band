<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>个人资料 · 乐团管理系统</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#13211D">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="山水乐团">

<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/band-alive.js"></script>
<script src="/band-core.js"></script>
<script src="/band-media.js"></script>
<script src="/band-notify.js"></script>
<script src="/band-profile.js"></script>
<script src="/band-shell.js"></script>
<script src="/band-welcome.js"></script>
</head>
<body>
<div id="navbar"></div>

<article class="pf-card" id="pf-card">
  <div class="pf-av" id="big-av"></div>
  <div class="pf-id">
    <div class="pf-name" id="big-name"></div>
    <!-- 身份行与个人栏浮层**共用同一个函数**（docs/14 §14.6.4：两处同源，别各写一份） -->
    <div class="pf-tags" id="big-tags"></div>
    <!-- ⭐ 「参演过 N 场专场」（`docs/14` §14.6.4「个人页」第 6 条，`交接单 #117`）：
         ⚠️ 与 `member-detail.html`（**别人的**主页）**共用同一块**（同一个 `mountShowcaseCount`）。
         ⚠️ 只放这一个数（出勤率之类有可见性口径的别搬过来）。
         ⚠️ **0 也照常显示 `0`**：「一场没参演过」是事实，与"0/0 无意义"不是一回事。 -->
    <div class="pf-show">参演过 <b id="showcase-n">—</b> 场专场</div>
    <p class="pf-intro" id="big-intro"></p>
    <div class="pf-facts">
      <div class="pf-fact"><div class="k">生 日</div><div class="v" id="big-birthday">—</div></div>
      <div class="pf-fact"><div class="k">入 团</div><div class="v" id="big-joined">—</div></div>
      <div class="pf-fact"><div class="k">联系方式</div><div class="v" id="big-contact">—</div></div>
    </div>
    <!-- ⚠️ 只读说明行**必须有**：这就是"不能改名"的落地方式，免得用户以为页面坏了（docs/14 §14.6.4） -->
    <p class="pf-rd">姓名 / 声部 / 乐器 / 角色 / 学号由管理员维护，需要修改请联系管理员</p>
    <!-- 荣誉团员整页只读（docs/02 §2.3）：编辑入口整块隐藏，这句是给他们看的解释 -->
    <p class="pf-honor" id="honorary-note" hidden>荣誉团员为只读身份，头像与个人资料由管理员维护</p>
    <div class="pf-foot" id="edit-entry">
      <button id="edit-btn" class="go go-ghost go-sm" type="button">编辑名片</button>
    </div>
  </div>
</article>

<section class="pf-edit" id="pf-edit" hidden>
  <div class="pf-edit-h">
    <h2>编辑名片</h2>
    <span class="fine">只提交动过的项；没保存就关掉等于没改</span>
  </div>

  <div class="pf-field">
    <div class="pf-label"><span class="l">头像</span><span class="c" id="av-name">不用头像</span></div>
    <div id="av-grid" class="av-grid"></div>
    <p class="av-hint">头像由管理员上传到共享清单，这里只能选</p>
  </div>

  <div class="pf-field">
    <div class="pf-label"><span class="l">简介</span><span class="c"><span id="intro-count">0</span>/100</span></div>
    <textarea id="f-intro" class="pf-in" maxlength="100" placeholder="个人简介 / 签名（≤100 字）"></textarea>
  </div>

  <div class="pf-field">
    <div class="pf-label"><span class="l">联系方式</span><span class="c"><span id="contact-count">0</span>/128</span></div>
    <input id="f-contact" class="pf-in" maxlength="128" placeholder="联系方式（自由填写，如 微信 xxx / QQ xxx）">
  </div>

  <div class="pf-field">
    <div class="pf-label"><span class="l">生日</span><span class="c" id="bd-state"></span></div>
    <div class="pf-row">
      <input id="f-birthday" type="date" class="pf-in">
      <button id="clear-bd" class="pf-link" type="button">清空</button>
      <button id="undo-bd" class="pf-link" type="button" hidden>撤销清空</button>
    </div>
    <!-- 本人知情（docs/14 §14.6.4）：这条会被公开，先让人知道再让他填 -->
    <p class="pf-bd-note" id="bd-note">填了生日，全团会在那天看到你的生日通告；公开处只显示月-日。</p>
  </div>

  <div class="pf-acts">
    <button id="edit-cancel" class="go go-ghost go-sm" type="button">取消</button>
    <button id="save" class="go go-sm" type="button">保存</button>
  </div>
</section>

<script>
'use strict';

let me = null;      // /api/auth/me 的响应
let profile = null; // GET /api/me/profile 的响应
let picked = null;  // 草稿里选中的头像标识符（null = 不用头像）

const el = (id) => document.getElementById(id);

/** 生日在公开处只露月-日（docs/14「生日只显示月-日」）。 */
function monthDay(v) {
  const m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[2] + '-' + m[3] : '';
}

function renderCard() {
  BAND.paintAvatar(el('big-av'), { name: profile.name, avatar: profile.avatar });
  el('big-name').textContent = profile.name;
  el('big-tags').textContent = BAND.identityTags(profile);

  const intro = el('big-intro');
  intro.textContent = profile.intro || '还没有简介';
  intro.classList.toggle('empty', !profile.intro);

  el('big-birthday').textContent = monthDay(profile.birthday) || '未填';
  el('big-joined').textContent = profile.joinedAt ? String(profile.joinedAt).slice(0, 10) : '—';
  el('big-contact').textContent = profile.contact || '未填';
}

/** 把服务端的值灌回编辑面板（打开时、取消时、保存后各灌一次）。 */
function fillForm() {
  picked = profile.avatar || null;
  el('f-intro').value = profile.intro || '';
  el('f-contact').value = profile.contact || '';
  el('f-birthday').value = profile.birthday || '';
  el('bd-state').textContent = profile.birthday ? '已填' : '未填';
  el('undo-bd').hidden = true;
  syncCounts();
  syncAvatarName();
  renderCard();
}

function syncCounts() {
  el('intro-count').textContent = el('f-intro').value.length;
  el('contact-count').textContent = el('f-contact').value.length;
}

function syncAvatarName() {
  const item = [{ id: null, name: '不用头像' }].concat(BAND.avatarList || [])
    .find((x) => x.id === picked);
  el('av-name').textContent = item ? item.name : '不用头像';
}

/** 预置头像网格：清单与素材一起放在 `vendor/avatars/`（**服务端读的是同一份**）。 */
async function renderGrid() {
  const host = el('av-grid');
  // 清单由 app.js 统一取并缓存（`renderNav` 已经 await 过一次，这里通常是零成本命中）——
  // 别在本页再 fetch 一份，否则"清单是唯一权威"就变成两处各自解释了
  await BAND.avatars();
  const avatars = BAND.avatarList;
  host.innerHTML = '';
  const items = [{ id: null, name: '不用头像' }].concat(avatars);
  for (const item of items) {
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'av-cell' + (item.id === picked ? ' on' : '');
    cell.title = item.name;
    cell.setAttribute('aria-pressed', String(item.id === picked));
    if (item.id) {
      const img = document.createElement('img');
      img.className = 'av-img';
      img.alt = item.name;
      // 按清单里的 `file` 取文件，**不在代码里拼后缀**（docs/14 §14.6.4）
      img.src = '/vendor/avatars/' + encodeURIComponent(item.file);
      cell.appendChild(img);
    } else {
      const span = document.createElement('span');
      span.className = 'av-none';
      span.textContent = '首字';
      cell.appendChild(span);
    }
    cell.addEventListener('click', () => {
      picked = item.id;
      host.querySelectorAll('.av-cell').forEach((c) => {
        c.classList.remove('on');
        c.setAttribute('aria-pressed', 'false');
      });
      cell.classList.add('on');
      cell.setAttribute('aria-pressed', 'true');
      syncAvatarName();
      // 选头像时先在本页名片上预览（保存前的草稿态）
      BAND.paintAvatar(el('big-av'), { name: profile.name, avatar: picked });
    });
    host.appendChild(cell);
  }
  syncAvatarName();
}

/** 草稿与服务端的差异（只提交动过的字段，docs/14 §14.6.4 第 5 条）。 */
function changedFields() {
  const intro = el('f-intro').value.trim();
  const contact = el('f-contact').value.trim();
  const birthday = el('f-birthday').value || null;
  const out = [];
  if ((profile.avatar || null) !== picked) out.push('头像');
  if ((profile.intro || '') !== intro) out.push('简介');
  if ((profile.contact || '') !== contact) out.push('联系方式');
  if ((profile.birthday || null) !== birthday) out.push('生日');
  return out;
}

function closeEdit() {
  el('pf-edit').hidden = true;
}

async function load() {
  me = await BAND.renderNav('profile.html');
  if (!me) return;
  profile = await BAND.must('/api/me/profile');   // must 已解包，拿到的就是 data
  fillForm();
  await BAND.mountShowcaseCount(el('showcase-n'), profile.id);
  // 荣誉团员只读（docs/02 §2.3）：**整块隐藏**编辑入口，别让他们点进去撞 403。
  // 用 hidden 而不是删节点——下面 #save 的监听器是模块顶层绑的，删了会炸。
  if (me.role === 'HONORARY') {
    el('edit-entry').hidden = true;
    el('honorary-note').hidden = false;
    return;
  }
  await renderGrid();
}

el('edit-btn').addEventListener('click', async () => {
  fillForm();
  await renderGrid();
  el('pf-edit').hidden = false;
  el('pf-edit').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

el('edit-cancel').addEventListener('click', async () => {
  const changed = changedFields();
  if (changed.length) {
    const ok = await BAND.confirm({
      title: '放弃这次修改？',
      body: '还有 ' + changed.length + ' 项没保存，关掉就没了。',
      ok: '放弃',
    });
    if (!ok) return;
  }
  fillForm();
  await renderGrid();
  closeEdit();
});

el('f-intro').addEventListener('input', syncCounts);
el('f-contact').addEventListener('input', syncCounts);

// 清空只动草稿；真正提交靠保存时的 `clearBirthday`（null 表示"这次不改"）
el('clear-bd').addEventListener('click', () => {
  if (!el('f-birthday').value) {
    BAND.toast('本来就没填生日', 'success');
    return;
  }
  el('f-birthday').value = '';
  el('bd-state').textContent = '待清空';
  el('undo-bd').hidden = false;
});

el('undo-bd').addEventListener('click', () => {
  el('f-birthday').value = profile.birthday || '';
  el('bd-state').textContent = profile.birthday ? '已填' : '未填';
  el('undo-bd').hidden = true;
});

el('save').addEventListener('click', async () => {
  const changed = changedFields();
  if (!changed.length) {
    BAND.toast('没有改动', 'success');
    return;
  }
  const body = {};
  if (changed.includes('头像')) body.avatar = picked;
  if (changed.includes('简介')) body.intro = el('f-intro').value.trim();
  if (changed.includes('联系方式')) body.contact = el('f-contact').value.trim();
  if (changed.includes('生日')) {
    const birthday = el('f-birthday').value || null;
    // 生日清空：null 已经表示"这次不改"，所以清空要走显式开关
    if (birthday) body.birthday = birthday;
    else body.clearBirthday = true;
  }
  profile = await BAND.must('/api/me/profile', { method: 'PUT', body });
  fillForm();
  await renderGrid();
  BAND.toast('已保存 ' + changed.length + ' 项改动：' + changed.join('、'), 'success');
});

load();
</script>
</body>
</html>
