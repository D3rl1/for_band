<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暂时离线 · 山水民族管弦乐团</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#13211D">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/pwa-252/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/pwa-252/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="山水乐团">
<style>
  /* 自包含兜底页：不加载 band.css / band-core.js，断网时也必须能显示 */
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding:
      calc(32px + env(safe-area-inset-top, 0px))
      calc(24px + env(safe-area-inset-right, 0px))
      calc(32px + env(safe-area-inset-bottom, 0px))
      calc(24px + env(safe-area-inset-left, 0px));
    background: radial-gradient(circle at 36% 26%, #1B3029, #13211D 72%);
    color: #EAF3EF;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    text-align: center;
  }
  .card { max-width: 420px; }
  .mark {
    width: 64px; height: 64px; margin: 0 auto 22px;
    display: grid; place-items: center;
    border: 1px solid rgba(234, 243, 239, .34);
    border-radius: 50%;
    font-size: 26px; letter-spacing: .08em;
    color: #EAF3EF;
  }
  h1 { margin: 0 0 14px; font-size: 22px; font-weight: 600; letter-spacing: .04em; }
  p { margin: 0 auto 26px; max-width: 340px; font-size: 14px; line-height: 1.75; color: rgba(234, 243, 239, .78); }
  button {
    min-height: 40px; padding: 0 26px;
    border: 1px solid rgba(234, 243, 239, .42);
    border-radius: 999px;
    background: rgba(234, 243, 239, .08);
    color: #EAF3EF;
    font: inherit; font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: rgba(234, 243, 239, .16); }
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">山</div>
  <h1>现在没有网络</h1>
  <p>现在没有网络。已访问过的页面仍可打开；联网后刷新即可恢复数据。</p>
  <button type="button" id="retry">重试</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () {
    location.reload();
  });
</script>
</body>
</html>
