<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活动详情 · 乐团管理系统</title>
<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/band-alive.js"></script>
<script src="/band-core.js"></script>
<script src="/band-media.js"></script>
<script src="/band-notify.js"></script>
<script src="/band-profile.js"></script>
<script src="/band-shell.js"></script>
<script src="/band-welcome.js"></script>
</head>
<body>
<div id="navbar"></div>

<div id="info" class="cell mb-4"><div class="lab">加载中…</div></div>
<div id="checkin-area" class="mb-4"></div>
<div id="banner" class="cell mb-4" hidden></div>

<!-- 这场活动练了哪些曲（docs/04 §4.5，期 3 起）：只读，所有角色都能看；没关联曲目时整块不出现 -->
<div id="pieces" class="cell mb-4" hidden>
  <div class="lab">练了哪些曲</div>
  <div id="pieces-list"></div>
</div>

<h2 class="mb-3">考勤</h2>
<table class="tb" id="att-table">
  <thead><tr><th>团员</th><th>声部</th><th>状态</th><th>签到时间</th><th>代签人</th><th class="act"></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<p class="chip" id="summary"></p>

<script>
const id = new URLSearchParams(location.search).get('id');
const statusText = { PRESENT: '出勤', LEAVE: '请假' };

async function load() {
  const me = await BAND.renderNav('events.html');
  if (!me) return;
  const e = await BAND.must(`/api/events/${id}`);
  const canceled = e.status === 'CANCELED';
  document.querySelector('.head h1').textContent = e.title; // 页标题 = 活动名

  const info = document.getElementById('info');
  const timeRange = `${e.startTime.slice(0, 5)}–${e.endTime.slice(0, 5)}`;
  const eyebrow = `${BAND.kindLabel(e.kind)}${canceled ? ' · 已取消，签到关闭' : ''}`;
  if (BAND.isMobile()) {
    // 手机端：样张 `v-event-detail` 的卡片（眉标 + 时段大字 `.big` + `.dl` 键值）
    info.innerHTML = `<div class="lab"></div><h2 id="info-title" class="mb-1"></h2>
      <div class="big" id="info-time"></div>
      <dl class="dl"><dt>日期</dt><dd id="info-date"></dd>
        <dt>地点</dt><dd id="info-loc"></dd>
        <dt>对象</dt><dd id="info-obj"></dd></dl>
      <p class="mb-0 mt-2 text-secondary" id="info-content" hidden></p>`;
    info.querySelector('.lab').textContent = eyebrow;
    document.getElementById('info-title').textContent = e.title;
    document.getElementById('info-time').textContent = timeRange;
    document.getElementById('info-date').textContent = e.date;
    document.getElementById('info-loc').textContent = e.location || '地点待定';
    document.getElementById('info-obj').textContent = e.sectionName || '全员';
  } else {
    info.innerHTML = `<div class="lab"></div><h2 id="info-title" class="mb-2"></h2>
      <p class="mb-0" id="info-when"></p><p class="mb-0 text-secondary" id="info-content" hidden></p>`;
    info.querySelector('.lab').textContent = eyebrow;
    document.getElementById('info-title').textContent = e.title;
    document.getElementById('info-when').textContent =
      `${e.date} ${timeRange} · ${e.location || '地点待定'}` +
      (e.sectionName ? ` · ${e.sectionName}` : '');
  }
  if (e.content) {
    const c = document.getElementById('info-content');
    c.hidden = false;
    c.textContent = e.content;
  }

  // 练了哪些曲：只读展示（能不能改由活动管理页负责，服务端把权限收在 PUT /api/events/{id}/pieces）
  const links = await BAND.must(`/api/events/${id}/pieces`);
  if (links.length) {
    const box = document.getElementById('pieces');
    const host = document.getElementById('pieces-list');
    box.hidden = false;
    host.innerHTML = '';
    for (const p of links) {
      const row = document.createElement('p');
      row.className = 'mb-1';
      const a = document.createElement('a');
      a.href = `/piece-detail.html?id=${p.pieceId}`;
      a.textContent = `${p.orderNo ? p.orderNo + '. ' : ''}${p.title || '（曲目已删除）'}`;
      row.appendChild(a);
      const meta = document.createElement('span');
      meta.className = 'chip ms-2 mb-0';
      meta.textContent = [p.composer ? `作曲 ${p.composer}` : null, p.statusLabel]
        .filter(Boolean).join(' · ');
      row.appendChild(meta);
      host.appendChild(row);
    }
  }

  const banner = document.getElementById('banner');
  if (e.updatedByName && e.updatedByName !== e.createdByName) {
    banner.hidden = false;
    banner.innerHTML = `<div class="lab">修改痕迹</div><p class="mb-0"></p>`;
    banner.querySelector('p').textContent =
      `已被 ${e.updatedByName} 修改于 ${BAND.stamp(e.updatedAt)}`;
  }

  renderCheckin(me, e, canceled);
  await loadRows(me, canceled);
  // ⚠️ 在两个常驻容器都写完**之后**才播。`loadRows` 会被签到 / 代签 / 改考勤 / 定时器反复重调，
  // 但"播过"的标志只认这两个容器 ⇒ 后续重渲染直接给终值，不重播（docs/14 §14.6.4 ②）。
  // ⚠️ 手机端那张 `#att-sum` 必须一并交给 alive —— 出勤横条在那张卡里，不给它 root 就永远停在 scaleX(0)。
  const attSum = document.getElementById('att-sum');
  BAND.alive(document.getElementById('summary'), document.getElementById('att-table'),
    ...(attSum ? [attSum] : []));
}

function renderCheckin(me, e, canceled) {
  const area = document.getElementById('checkin-area');
  area.innerHTML = '';
  // 荣誉团员只读（docs/02 §2.3）：不显示签到按钮，也不显示请假入口
  if (me.role === 'HONORARY') return;
  if (canceled) return;
  if (e.myAttendanceStatus) {
    const label = statusText[e.myAttendanceStatus] || e.myAttendanceStatus;
    if (BAND.isMobile()) {
      // 手机端：样张 `v-event-detail` 的 `.signed`（✓ + 状态）。
      // ⚠️ **不加样张那颗「撤销」**——本人签到本就撤不掉，样张那颗是简化（照约束②不抄）。
      const box = document.createElement('div');
      box.className = 'signed';
      box.innerHTML = '<span class="sd-mark">✓</span><div class="sd-body"><b></b></div>';
      box.querySelector('.sd-body b').textContent =
        e.myAttendanceStatus === 'PRESENT' ? '已签到'
          : e.myAttendanceStatus === 'LEAVE' ? '已请假' : label;
      area.appendChild(box);
    } else {
      const done = document.createElement('p');
      done.className = 'chip';
      done.textContent = `你的状态：${label}`;
      area.appendChild(done);
    }
    return;
  }
  const notStarted = new Date(`${e.date}T${e.startTime}`) > new Date();
  const wrap = document.createElement('div');
  wrap.className = 'stamp-wrap d-inline-block';
  const btn = document.createElement('button');
  btn.className = 'go';
  btn.textContent = '签 到';
  btn.addEventListener('click', async () => {
    // 签到一按就落库、自己撤不掉 → 先确认（docs/05 §5.3 留痕块）；取消则**不发请求**
    if (!await BAND.confirm({ title: '确认签到？', ok: '签 到' })) return;
    try {
      const row = await BAND.must(`/api/events/${id}/attendance`, { method: 'POST', body: {} });
      if (row) {
        BAND.chime(); // 确认声：只在签到成功（§14.6.6），印章是视觉等价物
        const stamp = document.createElement('span');
        stamp.className = 'stamp on';
        stamp.textContent = '已 签 到';
        wrap.appendChild(stamp);
        setTimeout(load, 700);
      }
    } catch (err) { /* toast 已在 must 中弹出 */ }
  });
  wrap.appendChild(btn);
  area.appendChild(wrap);

  if (notStarted) {
    const leaveBtn = document.createElement('button');
    leaveBtn.className = 'go go-ghost go-sm ms-2 align-text-bottom';
    leaveBtn.textContent = '请假';
    leaveBtn.addEventListener('click', () => toggleLeaveForm(wrap));
    area.appendChild(leaveBtn);
  }
}

function toggleLeaveForm(wrap) {
  if (wrap.nextElementSibling && wrap.nextElementSibling.id === 'leave-form') {
    wrap.nextElementSibling.remove();
    return;
  }
  const form = document.createElement('div');
  form.id = 'leave-form';
  form.className = 'd-flex gap-2 mt-2';
  const input = document.createElement('input');
  input.className = 'flex-grow-1';
  input.placeholder = '请假理由（必填）';
  const submit = document.createElement('button');
  submit.className = 'go go-ghost go-sm';
  submit.textContent = '提交申请';
  submit.addEventListener('click', async () => {
    // 理由必填（docs/05 §5.5）——这里只是体验，后端才是闸门
    const reason = input.value.trim();
    if (!reason) {
      BAND.toast('请填写请假理由');
      input.focus();
      return;
    }
    await BAND.must(`/api/events/${id}/leave-requests`, {
      method: 'POST',
      body: { reason },
    });
    BAND.toast('已提交，等待审批', 'success');
    load();
  });
  form.append(input, submit);
  wrap.after(form);
}

async function loadRows(me, canceled) {
  const d = await BAND.must(`/api/events/${id}/attendance`);
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  const canChange = me.role === 'ADMIN' || me.role === 'LEADER';
  const canMark = ['ADMIN', 'LEADER'].includes(me.role);   // 代签收窄到管理员 + 团长（docs/02 §2.3）
  for (const r of d.rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td><td><span class="chip"></span></td><td></td><td></td><td class="act"></td>';
    // 姓名格：头像 + 姓名（与名册同一套姿势，走 paintAvatar 唯一入口）
    const nameWrap = document.createElement('span');
    nameWrap.className = 'av-name';
    const avSlot = document.createElement('span');
    avSlot.className = 'av-sm';
    BAND.paintAvatar(avSlot, r);
    nameWrap.append(avSlot, document.createTextNode(r.name));
    tr.children[0].appendChild(nameWrap);
    tr.children[1].textContent = r.sectionName || '';
    const chip = tr.querySelector('.chip');
    if (r.status === 'LEAVE') { chip.textContent = statusText.LEAVE; }
    else if (r.status === 'PRESENT') { chip.textContent = statusText.PRESENT; }
    else { chip.textContent = '缺勤'; chip.classList.add('warn'); } // 缺勤是异常态：朱砂
    tr.children[3].textContent = r.markedAt ? BAND.stamp(r.markedAt).slice(5) : '';
    tr.children[4].textContent = r.markedByName || '';
    const action = tr.children[5];
    // 有生效中请假的人不出现「代签」（docs/05 §5.3）：已驳回 / 已撤回不算——他该来，要能补签
    const onLeave = r.leaveStatus === 'PENDING' || r.leaveStatus === 'APPROVED';
    if (!canceled && canMark && !r.status && !onLeave) {
      const btn = document.createElement('button');
      btn.className = 'go go-ghost go-sm';
      btn.textContent = '代签';
      btn.addEventListener('click', async () => {
        // 确认层里**写明为谁签**——一行一个按钮，点错行的代价是改别人的考勤
        if (!await BAND.confirm({ title: `为 ${r.name} 签到？`, ok: '代 签' })) return;
        await BAND.must(`/api/events/${id}/attendance`, { method: 'POST', body: { memberId: r.memberId } });
        BAND.toast(`已为 ${r.name} 签到`, 'success');
        load();
      });
      action.appendChild(btn);
    } else if (!canceled && canChange && r.status) {
      const sel = document.createElement('select');
      sel.innerHTML = '<option value="PRESENT">出勤</option><option value="LEAVE">请假</option>';
      sel.value = r.status;
      sel.addEventListener('change', async () => {
        if (!r.recordId) return;
        // 开下拉手滑点到「请假」就直接写库 → 必须先确认，且写明"对谁、从什么改成什么"
        const ok = await BAND.confirm({
          title: `把 ${r.name} 的考勤从「${statusText[r.status]}」改成「${statusText[sel.value]}」？`,
        });
        if (!ok) { sel.value = r.status; return; }   // 取消：回滚下拉，且不发请求
        await BAND.must(`/api/attendance/${r.recordId}`, { method: 'PUT', body: { status: sel.value } });
        BAND.toast('已更新', 'success');
        load();
      });
      action.appendChild(sel);
    }
    tbody.appendChild(tr);
  }
  // 出勤率与请假数成对展示（docs/05 硬规则）。⚠️ 五个数**各自一个 span**——「界面的活性」① 要求
  // "要数的数字必须各自在独立元素里"；`·` 与「出勤率」这类标签留在外面当文本节点。
  document.getElementById('summary').innerHTML =
    `应到 <span class="n" data-count>${d.expected}</span> · 出勤 <span class="n" data-count>${d.present}</span>`
    + ` · 请假 <span class="n" data-count>${d.leave}</span> · 缺勤 <span class="n" data-count>${d.absent}</span>`
    + ` · 出勤率 <span class="n" data-count>${BAND.ratePct(d.rate, d.expected)}</span>`;

  // 手机端：把「出勤横条 + 汇总」做成一张卡摆在明细表前（样张 `v-event-detail` 的 `.card`）。
  // ⚠️ 卡建好后就**只更新**横条，别重建：`#summary` 是要被搬进来的**常驻节点**，重建会丢引用。
  if (BAND.isMobile()) {
    let card = document.getElementById('att-sum');
    if (!card) {
      card = document.createElement('div');
      card.id = 'att-sum';
      card.className = 'cell mb-4';
      document.getElementById('att-table').before(card);
      card.appendChild(document.getElementById('summary'));
      const bar = document.createElement('div');
      bar.className = 'attbar';
      bar.innerHTML = '<b></b>';
      card.appendChild(bar);
    }
    card.querySelector('.attbar').style.setProperty('--r', d.rate || 0);
  }
}

load();
</script>
</body>
</html>
