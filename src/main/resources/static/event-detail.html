<!DOCTYPE html>
<html lang="zh-CN" class="nav-collapsed">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活动详情 · 乐团管理系统</title>
<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/app.js"></script>
</head>
<body>
<div id="navbar"></div>

<div id="info" class="cell mb-4"><div class="lab">加载中…</div></div>
<div id="checkin-area" class="mb-4"></div>
<div id="banner" class="cell mb-4" hidden></div>

<h2 class="mb-3">考勤</h2>
<table class="tb">
  <thead><tr><th>团员</th><th>声部</th><th>状态</th><th>签到时间</th><th>代签人</th><th class="act"></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<p class="chip" id="summary"></p>

<script>
const id = new URLSearchParams(location.search).get('id');
const statusText = { PRESENT: '出勤', LEAVE: '请假' };

async function load() {
  const me = await BAND.renderNav('events.html');
  if (!me) return;
  const e = await BAND.must(`/api/events/${id}`);
  const canceled = e.status === 'CANCELED';
  document.querySelector('.head h1').textContent = e.title; // 页标题 = 活动名

  const info = document.getElementById('info');
  info.innerHTML = `<div class="lab"></div><h2 id="info-title" class="mb-2"></h2>
    <p class="mb-0" id="info-when"></p><p class="mb-0 text-secondary" id="info-content" hidden></p>`;
  info.querySelector('.lab').textContent =
    `${BAND.kindLabel(e.kind)}${canceled ? ' · 已取消，签到关闭' : ''}`;
  document.getElementById('info-title').textContent = e.title;
  document.getElementById('info-when').textContent =
    `${e.date} ${e.startTime.slice(0, 5)}–${e.endTime.slice(0, 5)} · ${e.location || '地点待定'}` +
    (e.sectionName ? ` · ${e.sectionName}` : '');
  if (e.content) {
    const c = document.getElementById('info-content');
    c.hidden = false;
    c.textContent = e.content;
  }

  const banner = document.getElementById('banner');
  if (e.updatedByName && e.updatedByName !== e.createdByName) {
    banner.hidden = false;
    banner.innerHTML = `<div class="lab">修改痕迹</div><p class="mb-0"></p>`;
    banner.querySelector('p').textContent =
      `已被 ${e.updatedByName} 修改于 ${e.updatedAt.replace('T', ' ').slice(0, 16)}`;
  }

  renderCheckin(me, e, canceled);
  await loadRows(me, canceled);
}

function renderCheckin(me, e, canceled) {
  const area = document.getElementById('checkin-area');
  area.innerHTML = '';
  if (canceled) return;
  if (e.myAttendanceStatus) {
    const done = document.createElement('p');
    done.className = 'chip';
    done.textContent = `你的状态：${statusText[e.myAttendanceStatus] || e.myAttendanceStatus}`;
    area.appendChild(done);
    return;
  }
  const notStarted = new Date(`${e.date}T${e.startTime}`) > new Date();
  const wrap = document.createElement('div');
  wrap.className = 'stamp-wrap d-inline-block';
  const btn = document.createElement('button');
  btn.className = 'go';
  btn.textContent = '签 到';
  btn.addEventListener('click', async () => {
    try {
      const row = await BAND.must(`/api/events/${id}/attendance`, { method: 'POST', body: {} });
      if (row) {
        BAND.chime(); // 确认声：只在签到成功（§14.6.6），印章是视觉等价物
        const stamp = document.createElement('span');
        stamp.className = 'stamp on';
        stamp.textContent = '已 签 到';
        wrap.appendChild(stamp);
        setTimeout(load, 700);
      }
    } catch (err) { /* toast 已在 must 中弹出 */ }
  });
  wrap.appendChild(btn);
  area.appendChild(wrap);

  if (notStarted) {
    const leaveBtn = document.createElement('button');
    leaveBtn.className = 'go go-ghost go-sm ms-2 align-text-bottom';
    leaveBtn.textContent = '请假';
    leaveBtn.addEventListener('click', () => toggleLeaveForm(wrap));
    area.appendChild(leaveBtn);
  }
}

function toggleLeaveForm(wrap) {
  if (wrap.nextElementSibling && wrap.nextElementSibling.id === 'leave-form') {
    wrap.nextElementSibling.remove();
    return;
  }
  const form = document.createElement('div');
  form.id = 'leave-form';
  form.className = 'd-flex gap-2 mt-2';
  const input = document.createElement('input');
  input.className = 'flex-grow-1';
  input.placeholder = '请假理由（可空）';
  const submit = document.createElement('button');
  submit.className = 'go go-ghost go-sm';
  submit.textContent = '提交申请';
  submit.addEventListener('click', async () => {
    await BAND.must(`/api/events/${id}/leave-requests`, {
      method: 'POST',
      body: { reason: input.value.trim() || null },
    });
    BAND.toast('已提交，等待审批', 'success');
    load();
  });
  form.append(input, submit);
  wrap.after(form);
}

async function loadRows(me, canceled) {
  const d = await BAND.must(`/api/events/${id}/attendance`);
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  const canChange = me.role === 'ADMIN' || me.role === 'LEADER';
  const canMark = ['ADMIN', 'LEADER', 'SECTION_LEADER'].includes(me.role);
  for (const r of d.rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td><td><span class="chip"></span></td><td></td><td></td><td class="act"></td>';
    tr.children[0].textContent = r.name;
    tr.children[1].textContent = r.sectionName || '';
    const chip = tr.querySelector('.chip');
    if (r.status === 'LEAVE') { chip.textContent = statusText.LEAVE; }
    else if (r.status === 'PRESENT') { chip.textContent = statusText.PRESENT; }
    else { chip.textContent = '缺勤'; chip.classList.add('warn'); } // 缺勤是异常态：朱砂
    tr.children[3].textContent = r.markedAt ? r.markedAt.replace('T', ' ').slice(5, 16) : '';
    tr.children[4].textContent = r.markedByName || '';
    const action = tr.children[5];
    if (!canceled && canMark && !r.status) {
      const btn = document.createElement('button');
      btn.className = 'go go-ghost go-sm';
      btn.textContent = '代签';
      btn.addEventListener('click', async () => {
        await BAND.must(`/api/events/${id}/attendance`, { method: 'POST', body: { memberId: r.memberId } });
        BAND.toast(`已为 ${r.name} 签到`, 'success');
        load();
      });
      action.appendChild(btn);
    } else if (!canceled && canChange && r.status) {
      const sel = document.createElement('select');
      sel.innerHTML = '<option value="PRESENT">出勤</option><option value="LEAVE">请假</option>';
      sel.value = r.status;
      sel.addEventListener('change', async () => {
        if (!r.recordId) return;
        await BAND.must(`/api/attendance/${r.recordId}`, { method: 'PUT', body: { status: sel.value } });
        BAND.toast('已更新', 'success');
        load();
      });
      action.appendChild(sel);
    }
    tbody.appendChild(tr);
  }
  // 出勤率与请假数成对展示（docs/05 硬规则）
  document.getElementById('summary').textContent =
    `应到 ${d.expected} · 出勤 ${d.present} · 请假 ${d.leave} · 缺勤 ${d.absent} · 出勤率 ${BAND.ratePct(d.rate)}`;
}

load();
</script>
</body>
</html>
