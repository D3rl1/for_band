<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声部管理 · 乐团管理系统</title>
<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/app.js"></script>
</head>
<body>
<div id="navbar"></div>

<div class="cell mb-4">
  <div class="lab">新增声部</div>
  <form id="create-form" class="row g-2">
    <div class="col-7"><input id="s-name" class="w-100" placeholder="声部名*" required></div>
    <div class="col-3"><input id="s-order" type="number" class="w-100" placeholder="顺序" value="0"></div>
    <div class="col-2"><button class="go go-sm w-100" type="submit">添加</button></div>
  </form>
</div>
<table class="tb">
  <thead><tr><th>顺序</th><th>声部名</th><th class="act"></th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script>
async function load() {
  const me = await BAND.renderNav('admin-sections.html');
  if (!me) return;
  const list = await BAND.must('/api/sections');
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  for (const s of list) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><input type="number" class="order-input" value="${s.orderNo}"></td>
      <td><input class="name-input w-100" value=""></td>
      <td class="act"><button class="go go-sm save-btn">保存</button></td>`;
    tr.querySelector('.name-input').value = s.name;
    tr.querySelector('.save-btn').addEventListener('click', async () => {
      await BAND.must(`/api/admin/sections/${s.id}`, {
        method: 'PUT',
        body: { name: tr.querySelector('.name-input').value.trim(), orderNo: Number(tr.querySelector('.order-input').value) },
      });
      BAND.toast('已保存', 'success');
      load();
    });
    tbody.appendChild(tr);
  }
}
document.getElementById('create-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  await BAND.must('/api/admin/sections', {
    method: 'POST',
    body: { name: document.getElementById('s-name').value.trim(), orderNo: Number(document.getElementById('s-order').value) },
  });
  BAND.toast('已添加', 'success');
  e.target.reset();
  document.getElementById('s-order').value = 0;
  load();
});
load();
</script>
</body>
</html>
