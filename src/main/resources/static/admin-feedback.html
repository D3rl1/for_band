<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反馈管理 · 乐团管理系统</title>
<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/band.css">
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/band-nav.js"></script>
<script src="/band-alive.js"></script>
<script src="/band-core.js"></script>
<script src="/band-media.js"></script>
<script src="/band-notify.js"></script>
<script src="/band-profile.js"></script>
<script src="/band-shell.js"></script>
<script src="/band-welcome.js"></script>
</head>
<body>
<div id="navbar"></div>

<!-- 2026-10-18 精装：双页签带计数；「已离团」用浅墨后缀、绝不着红；已处理卡整体降透明度，只留一行处理轨迹。 -->
<div class="ct-tabs" role="tablist" aria-label="反馈状态">
  <button class="ct-tab" id="tab-open" type="button" role="tab" aria-selected="true" aria-controls="list">待处理<b id="tab-open-n"></b></button>
  <button class="ct-tab" id="tab-handled" type="button" role="tab" aria-selected="false" aria-controls="list">已处理<b id="tab-handled-n"></b></button>
</div>
<div id="list"></div>
<p id="empty" class="ct-fb-empty" hidden></p>

<script>
'use strict';

let status = 'OPEN';
let page = 1;
const SIZE = 20;

function card(f) {
  const el = document.createElement('article');
  el.className = 'ct-fb' + (f.status === 'HANDLED' ? ' done' : '');

  const head = document.createElement('div');
  head.className = 'ct-fb-head';
  const who = document.createElement('b');
  if (f.memberName) {
    who.textContent = f.memberName;
  } else {
    // 已离团是「查无此人」的说明，不是错误——浅墨、不着红
    who.textContent = '（已离团）';
    who.classList.add('ct-offlist');
  }
  const when = document.createElement('span');
  when.className = 'ct-when';
  when.textContent = BAND.stamp(f.createdAt);
  head.append(who, when);

  const meta = document.createElement('p');
  meta.className = 'ct-fb-meta';
  // 页面路径 + 设备：定位问题的两个第一线索（pages 是前端自动带的，设备由服务端从 UA 解析）
  meta.textContent = [f.sectionName, f.pagePath, f.device].filter(Boolean).join(' · ');

  const body = document.createElement('p');
  body.className = 'ct-fb-body';
  body.textContent = f.content;

  el.append(head, meta, body);

  if (f.status === 'OPEN') {
    const note = document.createElement('input');
    note.className = 'inp';
    note.placeholder = '处理备注（可空，只留给你自己看）';
    note.setAttribute('aria-label', '处理备注');
    const act = document.createElement('div');
    act.className = 'ct-fb-act';
    const btn = document.createElement('button');
    btn.className = 'go go-sm';
    btn.type = 'button';
    btn.textContent = '标记已处理';
    btn.addEventListener('click', async () => {
      await BAND.must(`/api/admin/feedback/${f.id}`, {
        method: 'PUT',
        body: { status: 'HANDLED', adminNote: note.value.trim() || null },
      });
      BAND.toast('已标记', 'success');
      load();
    });
    act.appendChild(btn);
    el.append(note, act);
  } else {
    const done = document.createElement('p');
    done.className = 'ct-fb-done';
    done.textContent = `已处理${f.handledByName ? ' · ' + f.handledByName : ''}`
      + (f.handledAt ? ' · ' + BAND.stamp(f.handledAt) : '')
      + (f.adminNote ? ' · ' + f.adminNote : '');
    el.appendChild(done);
  }
  return el;
}

/** 页签上的两个计数：各拉一条 size=1 只取 total（不为了数字多拉两页内容）。 */
async function loadCounts() {
  const [open, handled] = await Promise.all([
    BAND.api('/api/admin/feedback?status=OPEN&page=1&size=1'),
    BAND.api('/api/admin/feedback?status=HANDLED&page=1&size=1'),
  ]);
  if (open.code === 0) document.getElementById('tab-open-n').textContent = String(open.data.total);
  if (handled.code === 0) document.getElementById('tab-handled-n').textContent = String(handled.data.total);
}

async function load() {
  const me = await BAND.renderNav('admin-feedback.html');
  if (!me) return;
  const d = await BAND.must(`/api/admin/feedback?status=${status}&page=${page}&size=${SIZE}`);
  const host = document.getElementById('list');
  host.innerHTML = '';
  const empty = document.getElementById('empty');
  empty.hidden = d.list.length > 0;
  empty.textContent = status === 'OPEN'
    ? '没有待处理的反馈——处理过的可以点上方「已处理」回看。'
    : '还没有处理过的反馈。';
  for (const f of d.list) host.appendChild(card(f));
  document.getElementById('tab-open').setAttribute('aria-selected', String(status === 'OPEN'));
  document.getElementById('tab-handled').setAttribute('aria-selected', String(status === 'HANDLED'));
  loadCounts();
}

document.getElementById('tab-open').addEventListener('click', () => { status = 'OPEN'; page = 1; load(); });
document.getElementById('tab-handled').addEventListener('click', () => { status = 'HANDLED'; page = 1; load(); });
load();
</script>
</body>
</html>
