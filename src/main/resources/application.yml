spring:
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/band?characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: band_app
  servlet:
    multipart:
      # ⚠️ 默认只有 1MB：不放开的话，超过 1MB 的上传会以"上传失败"的形式炸在这里，与真实的尺寸校验无关
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: 8080

band:
  storage:
    # 上传文件的落盘目录：**在仓库之外、不进 git**（docs/08 §8.5）。
    # 服务器按 docs/12 改成 /data/band/uploads/；本机默认放用户目录下。
    dir: ${user.home}/band-uploads
    # 单文件上限（可配置，见移交事项：规格原文只写"校验类型与大小"，没给数值）
    max-audio-bytes: 20971520   # 20MB（3 分钟的 m4a 约 3~5MB，留足余量）
    max-image-bytes: 8388608    # 8MB（前端会先压到长边 1920 / 质量 80%，约 1~2MB）
    max-score-bytes: 20971520   # 20MB（谱子 PDF）
    # 存储用量警戒线：超过它就在管理后台把用量那一行标成醒目色（docs/08 §8.3「到阈值时提醒管理员」）。
    # ⚠️ 规格没给这个数值，取 2GB 并做成可配置（已记移交请规格登记）。**只提醒，绝不自动删任何东西。**
    warn-bytes: 2147483648

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
